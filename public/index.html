const $=s=>document.querySelector(s),api=async(path,opt={})=>{const r=await fetch('/api'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`HTTP ${r.status} ${r.statusText||'Request gagal'}`);return d};let S={user:null,config:null,trees:[],tree:null,persons:[],rels:[],optionalLineages:[],branches:[],branch:null,branchPersons:[],branchRels:[],publicShareToken:'',pendingClaim:null};
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;',"\"":'&quot;'}[c]))}function toast(x){let t=$('#toast');t.textContent=x;t.classList.toggle('error',/gagal|salah|belum|tidak|error/i.test(x));t.style.display='block';setTimeout(()=>t.style.display='none',4200)}function askConfirm(title,message){return new Promise(resolve=>{$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)window.__confirmResolve(false)"><div class="card"><h2>${esc(title)}</h2><p class="muted">${esc(message)}</p><div class="actions"><button onclick="window.__confirmResolve(true)">Ya</button><button class="ghost" onclick="window.__confirmResolve(false)">Tidak</button></div></div></div>`;window.__confirmResolve=v=>{delete window.__confirmResolve;closeModal();resolve(v)}})}function full(p){if(!p)return '';const base=[p.first_name,p.last_name].filter(Boolean).join(' ');return [p.title_prefix,base,p.title_suffix].filter(Boolean).join(' ').replace(/\s+/g,' ').trim()}function age(b,d=''){if(!b)return null;let a=new Date(b+'T00:00:00'),z=d?new Date(d+'T00:00:00'):new Date();if(isNaN(a)||isNaN(z))return null;let n=z.getFullYear()-a.getFullYear();if(z.getMonth()<a.getMonth()||(z.getMonth()===a.getMonth()&&z.getDate()<a.getDate()))n--;return n}
async function boot(){try{S.inviteToken=S.inviteToken||localStorage.getItem('jn_pending_invite')||''}catch{}try{const pc=localStorage.getItem('jn_pending_claim');if(pc)S.pendingClaim=JSON.parse(pc)}catch{}let path=location.pathname.replace(/\/$/,'');if(path==='/setup-owner')return ownerSetup();if(path.startsWith('/f/'))return publicTree(path.slice(3));if(path.startsWith('/invite/'))return invitePage(path.slice(7));if(path==='/invite'){const qs=new URLSearchParams(location.search),tok=qs.get('token');if(tok){if(qs.get('register')==='1')return showInviteRegister(tok);return invitePage(tok)}}try{S.config=await api('/config')}catch(e){S.config={premium:{price:50000,familyMembers:5,generation:3,generationDown:2,sideGenerationDown:2},ultimate:{price:100000,familyMembers:20,generation:6,generationDown:6,sideGenerationDown:2},paymentInstructions:'Hubungi owner untuk instruksi pembayaran.'};toast('Konfigurasi server belum terbaca. Tampilan tetap dimuat.')}try{S.user=(await api('/me')).user}catch(e){S.user=null;toast('Sesi belum dapat dibaca. Silakan login kembali jika diperlukan.')}render()}function nav(){let n=$('#navActions');if(!S.user){n.innerHTML='<button class="ghost" onclick="showLogin()">Masuk</button> <button onclick="showRegister()">Daftar Owner Akun</button>'}else n.innerHTML=`<span class="muted">${esc(S.user.name)} · ${S.user.role==='owner'?'Owner Web':'Member'}</span> <button class="ghost" onclick="logout()">Keluar</button>`}
async function render(){nav();if(!S.user)return home();try{if(S.user.role==='owner')await ownerDash();else await memberDash()}catch(e){$('#app').innerHTML=`<div class="card"><h2>Gagal memuat dashboard</h2><p class="muted">${esc(e.message||'Terjadi kesalahan pada server.')}</p><button onclick="location.reload()">Coba lagi</button></div>`;toast(e.message||'Terjadi kesalahan')}}function home(){$('#app').innerHTML=`<section class="hero"><div class="hero-inner"><div class="eyebrow">SILSILAH KELUARGA DIGITAL</div><h1>Menjaga Jejak,<br>Menghubungkan Generasi.</h1><p>Bangun, simpan, dan wariskan silsilah keluarga Anda dalam satu tempat yang mudah digunakan dan dapat dikelola bersama keluarga.</p><div class="hero-actions"><button onclick="showRegister()">Mulai Membuat Silsilah</button><button class="ghost" onclick="showLogin()">Masuk</button></div></div></section><section class="feature-grid"><div class="feature-card"><h3>🌳 Pohon keluarga</h3><p>Hubungkan leluhur, pasangan, anak, saudara, dan cabang keluarga.</p></div><div class="feature-card"><h3>👨‍👩‍👧 Kolaborasi keluarga</h3><p>Owner dapat mengundang dan menerima Family Member dengan hak akses terkontrol.</p></div><div class="feature-card"><h3>🔐 Akses terkontrol</h3><p>Family Member hanya dapat mengelola wilayah silsilah sesuai paket.</p></div></section><section class="packages"><div class="section-kicker">Pilihan paket</div><h2 class="section-title">Pilih sesuai kebutuhan keluarga</h2><div class="package-grid"><div class="package-card"><h3>Premium</h3><p>Untuk keluarga yang ingin mulai membangun silsilah digital.</p><div class="price">Rp ${Number(S.config?.premium?.price||50000).toLocaleString('id-ID')}</div><div class="muted">5 Family Member · 3 generasi atas + 2 bawah · samping 2 bawah</div></div><div class="package-card featured"><h3>Ultimate</h3><p>Untuk keluarga besar dengan kebutuhan pengelolaan yang lebih luas.</p><div class="price">Rp ${Number(S.config?.ultimate?.price||100000).toLocaleString('id-ID')}</div><div class="muted">20 Family Member · 6 generasi atas + 6 bawah · samping 2 bawah</div></div></div></section>`}
function clearPendingContext(){S.inviteToken='';S.pendingClaim=null;try{localStorage.removeItem('jn_pending_invite');localStorage.removeItem('jn_pending_claim')}catch{}}function togglePassword(id,btn){const x=$('#'+id);if(!x)return;x.type=x.type==='password'?'text':'password';if(btn)btn.textContent=x.type==='password'?'👁':'🙈'}function passwordField(id,placeholder){return `<div class="password-wrap"><input id="${id}" type="password" placeholder="${placeholder}" minlength="8" required><button type="button" class="password-eye ghost" onclick="togglePassword('${id}',this)">👁</button></div>`}function showLogin(preserveContext=false){if(!preserveContext)clearPendingContext();nav();$('#app').innerHTML=`<div class="card" style="max-width:520px;margin:auto"><h2>Masuk</h2><form class="form" onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required>${passwordField('password','Password')}<button>Masuk</button></form><button class="ghost" style="margin-top:10px" onclick="home()">Kembali</button></div>`}function showRegister(){clearPendingContext();$('#modal').innerHTML=`<div class="modal"><div class="card"><h2>Daftar Owner Akun</h2><form class="form" onsubmit="register(event)"><input id="rname" placeholder="Nama lengkap" required><input id="remail" type="email" placeholder="Email" required>${passwordField('rpass','Password minimal 8 karakter')}${passwordField('rpass2','Konfirmasi password')}<div class="notice"><b>Owner Akun</b><br>Setelah pendaftaran, akun langsung menunggu persetujuan Owner Web. Pembayaran belum diaktifkan pada v6.00.</div><select id="rplan"><option value="premium">Premium</option><option value="ultimate">Ultimate</option></select><button>Daftar Owner Akun</button><button type="button" class="ghost" onclick="closeModal()">Batal</button></form></div></div>`}function showClaimRegister(){const c=S.pendingClaim;if(!c)return showRegister();$('#modal').innerHTML=`<div class="modal"><div class="card"><h2>Daftar Family Member</h2><form class=" async function removeFamilyMember(id){const ok=await askConfirm('Hapus Family Member?','Hubungan Family Member akan dihapus permanen. Jika akun tersebut tidak lagi terhubung ke silsilah lain, akunnya juga dihapus agar email dapat digunakan untuk pendaftaran ulang. Anggota dapat diklaim ulang.');if(!ok)return;try{const d=await api('/trees/'+S.tree.id+'/family-members',{method:'DELETE',body:JSON.stringify({memberId:id})});toast(d.message||'Family Member dihapus permanen.');await ownerAccountDash(S.tree)}catch(e){toast(e.message)}}async function loadInvites(){try{let r=await api('/my/invitations');$('#myInvites').innerHTML=r.invites.map(i=>`<div class="item row"><span>${esc(i.tree_name)} — ${esc(i.first_name+' '+i.last_name)}</span>${i.requested_at?'<span class="pill pending">Menunggu persetujuan Owner</span>':`<button onclick="requestInvite('${i.token}')">Ajukan bergabung</button>`}</div>`).join('')||'<span class="muted">Tidak ada undangan.</span>'}catch(e){$('#myInvites').textContent=e.message}}async function requestInvite(t){try{await api('/invite?token='+encodeURIComponent(t),{method:'POST'});toast('Permintaan bergabung dikirim. Tunggu persetujuan Owner Akun.');memberDash()}catch(e){toast(e.message)}}async function loadMemberships(){try{let r=await api('/my/memberships');$('#myMemberships').innerHTML=r.memberships.map(x=>`<div class="item">${esc(x.tree_name)} · Anda terhubung sebagai <b>${esc(x.first_name+' '+x.last_name)}</b></div>`).join('')||'<span class="muted">Belum ada.</span>'}catch(e){$('#myMemberships').textContent=e.message}}
function newTree(){S.treeSetup={};$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Silsilah Baru</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="muted">Pilih apakah nama silsilah dibuat sendiri atau otomatis mengikuti nama anggota laki-laki teratas.</p><form class="form" onsubmit="createTree(event)"><div class="radio-grid"><label><input type="radio" name="namemode" value="auto" checked> Otomatis — nama laki-laki teratas</label><label><input type="radio" name="namemode" value="manual"> Saya tentukan nama sendiri</label></div><input id="newTreeName" placeholder="Nama silsilah (jika manual)"><textarea id="newTreeDesc" placeholder="Deskripsi singkat (opsional)"></textarea><button>Buat Silsilah</button></form></div></div>`}async function createTree(e){e.preventDefault();let mode=document.querySelector('input[name=namemode]:checked')?.value||'auto';let name=$('#newTreeName').value.trim();if(mode==='manual'&&!name){toast('Isi nama silsilah atau pilih otomatis.');return}try{await api('/trees',{method:'POST',body:JSON.stringify({name,autoName:mode==='auto',description:$('#newTreeDesc').value})});closeModal();memberDash()}catch(x){toast(x.message)}}async function requestUpgrade(){try{let d=await api('/account/upgrade',{method:'POST'});toast(d.message)}catch(e){toast(e.message)}}
function personNode(p,editable){let a=age(p.birth_date,p.death_date),status=p.death_date?`Wafat · ${a??'-'} th`:(a==null?'':a+' th');let actions='';if(editable){actions+=`<button class="tree-action" onclick="event.stopPropagation();editPerson(${p.id})">Edit</button>`;if(S.user?.role==='member'&&S.tree?.created_by===S.user.id)actions+=`<button class="tree-action ghost" onclick="event.stopPropagation();privacyPerson(${p.id})">Info Publik</button><button class="tree-action danger" onclick="event.stopPropagation();delPerson(${p.id})">Hapus</button>`}return `<div class="node"><b>${esc(full(p))}</b><span>${p.gender==='male'?'♂':p.gender==='female'?'♀':'•'} ${esc(status)}</span>${p.birth_place?`<span>${esc(p.birth_place)}</span>`:''}${actions?`<div class="tree-actions">${actions}</div>`:''}</div>`}
function graphRows(persons,rels){const byId=new Map(persons.map(p=>[p.id,p])),parents=new Map(),children=new Map(),spouses=new Map(),childSeen=new Map(),spouseSeen=new Map();const add=(m,k,v)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(v)};for(let i=0;i<rels.length;i++){const r=rels[i];if(r.type==='parent'){add(parents,r.to_person_id,r.from_person_id);add(children,r.from_person_id,r.to_person_id);if(!childSeen.has(r.from_person_id))childSeen.set(r.from_person_id,new Map());childSeen.get(r.from_person_id).set(r.to_person_id,i)}else if(r.type==='spouse'){add(spouses,r.from_person_id,r.to_person_id);add(spouses,r.to_person_id,r.from_person_id);if(!spouseSeen.has(r.from_person_id))spouseSeen.set(r.from_person_id,new Map());if(!spouseSeen.has(r.to_person_id))spouseSeen.set(r.to_person_id,new Map());spouseSeen.get(r.from_person_id).set(r.to_person_id,i);spouseSeen.get(r.to_person_id).set(r.from_person_id,i)}}const rank=p=>p?.gender==='male'?0:p?.gender==='female'?1:2;for(const [k,v] of children)v.sort((a,b)=>{const oa=Number(byId.get(a)?.sibling_order||0),ob=Number(byId.get(b)?.sibling_order||0);if(oa&&ob&&oa!==ob)return oa-ob;if(oa&&!ob)return -1;if(ob&&!oa)return 1;return (childSeen.get(k)?.get(a)??0)-(childSeen.get(k)?.get(b)??0)||String(full(byId.get(a)||'')).localeCompare(String(full(byId.get(b)||'')))||a-b});for(const [k,v] of spouses)v.sort((a,b)=>(spouseSeen.get(k)?.get(a)??0)-(spouseSeen.get(k)?.get(b)??0)||rank(byId.get(a))-rank(byId.get(b))||a-b);const roots=persons.filter(p=>!(parents.get(p.id)||[]).length).sort((a,b)=>{const oa=Number(a.sibling_order||0),ob=Number(b.sibling_order||0);return (oa-ob)||rank(a)-rank(b)||String(full(a)).localeCompare(String(full(b)))||a-b});return{byId,parents,children,spouses,roots:roots.length?roots:persons.slice().sort((a,b)=>String(full(a)).localeCompare(String(full(b)))||a-b)}}
function mainRoot(persons,rels,rootId){const g=graphRows(persons,rels);const explicit=persons.find(p=>Number(p.id)===Number(rootId));if(explicit&&explicit.gender==='male')return explicit;const males=persons.filter(p=>p.gender==='male'&&!(g.parents.get(p.id)||[]).length).sort((a,b)=>Number(a.sibling_order||0)-Number(b.sibling_order||0)||String(full(a)).localeCompare(String(full(b)))||a.id-b.id);return males[0]||g.roots[0]||null}
function spousePairHtml(people,nodeFn){return people.map((x,i)=>`${i?'<div class="spouse-gap" aria-hidden="true"><span></span></div>':''}<div class="node-wrap">${nodeFn(x)}</div>`).join('')}
function buildTreeLayout(persons,rels,nodeFn,extraLabel='Anggota lain',rootId=null){const g=graphRows(persons,rels),used=new Set();function family(id){if(used.has(id))return '';const p=g.byId.get(id);if(!p)return '';const spouses=(g.spouses.get(id)||[]).map(x=>g.byId.get(x)).filter(x=>x&&!used.has(x.id));const people=[p,...spouses];people.forEach(x=>used.add(x.id));const childIds=[];for(const x of people)for(const cid of g.children.get(x.id)||[])if(!used.has(cid))childIds.push(cid);const unique=[...new Set(childIds)];return `<div class="tree-family"><div class="tree-couple${unique.length?' tree-couple-children':''}">${spousePairHtml(people,nodeFn)}</div>${unique.length?`<div class="family-connector"></div><div class="family-children">${unique.map(cid=>family(cid)).join('')}</div>`:''}</div>`}const root=mainRoot(persons,rels,rootId);const rootHtml=root?family(root.id):'';return rootHtml?`<div class="tree-canvas"><div class="tree-root-list">${rootHtml}</div></div>`:`<div class="tree-canvas"><div class="muted">Belum cukup data untuk membentuk pohon.</div></div>`}
function buildTree(persons,rels,editable,rootId){const canEdit=p=>editable&&p.can_edit!==false;return buildTreeLayout(persons,rels,p=>personNode(p,canEdit(p)),'',rootId)}
function displayName(p){return p?.name||full(p)||'Anggota'}
function optionalComponent(anchorId,links,persons){const all=links||[],ids=new Set([Number(anchorId)]),rows=[],seen=new Set();let frontier=new Set([Number(anchorId)]);while(frontier.size){const next=new Set();for(const x of all){if(seen.has(x.id))continue;const a=Number(x.anchor_person_id),l=Number(x.linked_person_id);if(frontier.has(a)||frontier.has(l)){seen.add(x.id);rows.push(x);if(!ids.has(a)){ids.add(a);next.add(a)}if(!ids.has(l)){ids.add(l);next.add(l)}}}frontier=next}const orderByChild=new Map();for(const x of rows){const label=String(x.relation_label||'').toLowerCase();if(label==='anak')orderByChild.set(Number(x.linked_person_id),Number(x.sibling_order||0));else if(['ayah','ibu','kakek','nenek'].includes(label))orderByChild.set(Number(x.anchor_person_id),Number(x.sibling_order||0))}const ps=(persons||[]).filter(p=>ids.has(Number(p.id))).map(p=>({...p,sibling_order:orderByChild.get(Number(p.id))||0})),rels=[];for(const x of rows){const a=Number(x.anchor_person_id),l=Number(x.linked_person_id),label=String(x.relation_label||'Keluarga').toLowerCase();if(['ayah','ibu','kakek','nenek'].includes(label))rels.push({id:-Number(x.id),from_person_id:l,to_person_id:a,type:'parent'});else if(label==='anak')rels.push({id:-Number(x.id),from_person_id:a,to_person_id:l,type:'parent'});else if(['suami','istri'].includes(label))rels.push({id:-Number(x.id),from_person_id:a,to_person_id:l,type:'spouse'});}return{persons:ps,rels,rows}}
function optionalTreeHtml(anchorId,links,persons,nodeFn){const q=optionalComponent(anchorId,links,persons);if(!q.persons.length)return '';const roots=q.persons.filter(p=>!q.rels.some(r=>r.type==='parent'&&Number(r.to_person_id)===Number(p.id)));const root=roots.find(p=>p.gender==='male')||roots[0]||q.persons.find(p=>p.gender==='male')||q.persons[0];return `<div class="optional-tree-block"><div class="optional-tree-title">Silsilah Keluarga ${esc(displayName(persons.find(p=>Number(p.id)===Number(anchorId))))}</div><div class="tree-workspace optional-tree-workspace"><div class="tree-stage optional-tree-stage">${buildTreeLayout(q.persons,q.rels,nodeFn,'',root?.id)}</div></div></div>`}
function optionalBranchHtml(links,persons,nodeFn){if(!links?.length)return '';const remaining=new Set(links.map(x=>x.id)),components=[];while(remaining.size){const first=[...remaining][0],row=links.find(x=>x.id===first);const q=optionalComponent(Number(row.anchor_person_id),links,persons);q.rows.forEach(x=>remaining.delete(x.id));components.push(optionalTreeHtml(Number(row.anchor_person_id),links,persons,nodeFn))}return `<div class="optional-wrap">${components.join('')}</div>`}

function primaryTreeIds(){const root=mainRoot(S.persons,S.rels,S.tree?.root_person_id);if(!root)return new Set();const g=graphRows(S.persons,S.rels),ids=new Set(),q=[root.id];while(q.length){const id=q.shift();if(ids.has(id))continue;ids.add(id);for(const x of g.spouses.get(id)||[])if(!ids.has(x))q.push(x);for(const x of g.children.get(id)||[])if(!ids.has(x))q.push(x)}return ids}

async function openTree(id,readonly=false){try{const fresh=await api('/trees?v='+Date.now());S.trees=fresh.trees||S.trees}catch{}S.tree=S.trees.find(x=>Number(x.id)===Number(id))||{};S.persons=(await api('/trees/'+id+'/persons?v='+Date.now())).persons||[];S.rels=(await api('/trees/'+id+'/relationships?v='+Date.now())).relationships||[];S.branches=(await api('/trees/'+id+'/branches?v='+Date.now()).catch(()=>({branches:[]}))).branches||[];if(!Number(S.tree.root_person_id)){const rr=mainRoot(S.persons,S.rels,null);if(rr)S.tree.root_person_id=Number(rr.id)}let access=readonly||S.user.role==='owner',owner=!readonly&&S.user.role==='member'&&S.tree.created_by===S.user.id;let share=await api('/trees/'+id+'/share').catch(()=>({public:false,token:null,url:null,plan:null}));S.tree.plan=share.plan||S.tree.plan||'premium';let publicBtn=share.public?`<a class="ghost link-button" href="${esc(share.url||'#')}" target="_blank" rel="noopener noreferrer">Buka Link Publik ↗</a>`:'';$('#app').innerHTML=`<div class="row"><div><h2>${esc(S.tree.name)}</h2><p class="muted">${esc(S.tree.description||'')}</p></div><div class="actions">${owner?'<button class="ghost" onclick="editTreeMeta()">Edit Silsilah</button>':''}<button class="ghost" onclick="${access?'ownerTrees()':'memberDash()'}">Kembali</button></div></div>${access?'<div class="notice">👁 Mode Owner Web — read only.</div>':`<div class="editor-grid" style="margin-top:18px"><div class="card"><h3>Tambah Anggota Utama</h3><form class="form" onsubmit="addPerson(event)"><input id="titlePrefix" placeholder="Gelar depan (opsional)"><input id="first" placeholder="Nama depan" required><input id="last" placeholder="Nama belakang"><input id="titleSuffix" placeholder="Gelar belakang (opsional)"><select id="gender"><option value="male">Laki-laki</option><option value="female">Perempuan</option><option value="other">Lainnya</option></select><label class="small muted">Tanggal lahir (opsional)</label><input id="birth" type="date"><label class="small mu function sortedMemberRows(){const g=graphRows(S.persons,S.rels),depth=new Map(),q=g.roots.map(x=>[x.id,0]);while(q.length){const [id,d]=q.shift();if(depth.has(id)&&depth.get(id)<=d)continue;depth.set(id,d);for(const c of g.children.get(id)||[])q.push([c,d+1]);for(const sp of g.spouses.get(id)||[])q.push([sp,d])}const rank=p=>p.gender==='male'?0:p.gender==='female'?1:2;return [...S.persons].sort((a,b)=>(depth.get(a.id)||0)-(depth.get(b.id)||0)||rank(a)-rank(b)||String(full(a)).localeCompare(String(full(b)))).map(p=>`<div class="item row"><div><b>${esc(full(p))}</b><div class="small muted">${p.birth_date?esc(p.birth_date):'Tanggal lahir tidak diisi'} ${p.death_date?' · Wafat '+esc(p.death_date):''}</div></div><div class="actions">${p.can_edit!==false?`<button onclick="editPerson(${p.id})">Edit</button>`:''}${S.user.role==='member'&&S.tree.created_by===S.user.id?`<button class="ghost" onclick="privacyPerson(${p.id})">Info Publik</button><button class="danger" onclick="delPerson(${p.id})">Hapus</button>`:''}</div></div>`).join('')}
function showOptionalLineage(){const owners=S.user?.role==='member'&&S.tree?.created_by===S.user.id;if(!owners){toast('Hanya Owner Akun yang dapat mengatur cabang keluarga.');return}const opts=S.persons.map(p=>`<option value="${p.id}">${esc(full(p))}</option>`).join('');$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Cabang Keluarga</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="hint">Tambahkan hubungan keluarga yang tidak menjadi bagian dari garis nasab utama. Contoh: ayah Nur Rahmalia dapat ditampilkan di cabang opsional tanpa masuk ke pohon utama.</p><form class="form" onsubmit="saveOptionalLineage(event)"><label class="small muted">Anggota utama / titik cabang</label><select id="optAnchor">${opts}</select><label class="small muted">Anggota dari cabang keluarga</label><select id="optLinked">${opts}</select><label class="small muted">Hubungan</label><select id="optLabel"><option>Ayah</option><option>Ibu</option><option>Suami</option><option>Istri</option><option>Anak</option><option>Saudara</option><option>Kakek</option><option>Nenek</option><option>Keluarga</option></select><button>Simpan Cabang Keluarga</button></form>${S.optionalLineages.length?`<div class="notice" style="margin-top:16px"><b>Cabang yang sudah dibuat</b>${S.optionalLineages.map(x=>`<div class="item row"><span>${esc(full(S.persons.find(p=>Number(p.id)===Number(x.anchor_person_id))))} ← ${esc(x.relation_label||'Keluarga')} — ${esc(full(S.persons.find(p=>Number(p.id)===Number(x.linked_person_id))))}</span><button class="danger" onclick="deleteOptionalLineage(${x.id})">Hapus</button></div>`).join('')}</div>`:''}</div></div>`}
async function saveOptionalLineage(e){e.preventDefault();try{await api('/trees/'+S.tree.id+'/optional-lineages',{method:'POST',body:JSON.stringify({anchorPersonId:Number($('#optAnchor').value),linkedPersonId:Number($('#optLinked').value),relationLabel:$('#optLabel').value})});closeModal();toast('Cabang Keluarga disimpan.');await openTree(S.tree.id,false)}catch(x){toast(x.message)}}
async function deleteOptionalLineage(id){if(!confirm('Hapus cabang cabang keluarga ini?'))return;try{await api('/trees/'+S.tree.id+'/optional-lineages',{method:'DELETE',body:JSON.stringify({id})});toast('Cabang Keluarga dihapus.');await openTree(S.tree.id,false)}catch(x){toast(x.message)}}
function editTreeMeta(){const auto=Number(S.tree.auto_name||0)===1;const males=S.persons.filter(p=>p.gender==='male'&&p.can_edit!==false);$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Edit Silsilah</h2><button class="ghost" type="button" onclick="closeModal()">Tutup</button></div><form class="form" onsubmit="saveTreeMeta(event)"><label class="small muted">Nama silsilah</label><input id="treeName" value="${esc(S.tree.name||'')}" ${auto?'disabled':''}><label class="check-grid"><span><input id="treeAuto" type="checkbox" ${auto?'checked':''} onchange="$('#treeName').disabled=this.checked"> Jadikan default — otomatis mengikuti nama laki-laki teratas</span></label><p class="hint">Silsilah utama JejakNasab memakai garis nasab ayah. Generasi teratas harus laki-laki yang belum memiliki orang tua di atasnya.</p><label class="small muted">Generasi teratas</label><select id="treeRoot">${males.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(S.tree.root_person_id)?'selected':''}>${esc(full(p))}</option>`).join('')}</select><p class="hint">Hanya laki-laki yang berada paling atas yang dapat dipilih sebagai root.</p><label class="small muted">Deskripsi (opsional)</label><textarea id="treeDesc">${esc(S.tree.description||'')}</textarea><button>Simpan</button><button type="button" class="ghost" onclick="closeModal()">Batal</button></form></div></div>`}async function saveTreeMeta(e){e.preventDefault();try{const auto=$('#treeAuto').checked;const name=$('#treeName').value.trim();if(!auto&&!name){toast('Nama silsilah wajib diisi.');return}await api('/trees/'+S.tree.id,{method:'PATCH',body:JSON.stringify({name,autoName:auto,description:$('#treeDesc').value})});const root=Number($('#treeRoot').value||0);if(root)await api('/trees/'+S.tree.id+'/root',{method:'PATCH',body:JSON.stringify({rootPersonId:root})});closeModal();toast(auto?'Pengaturan silsilah disimpan.':'Nama silsilah disimpan.');let r=await api('/trees');S.trees=r.trees;S.tree=S.trees.find(x=>x.id===S.tree.id)||S.tree;openTree(S.tree.id,false)}catch(x){toast(x.message)}}async function addPerson(e){e.preventDefault();try{let anchor=$('#anchor').value;let rt=anchor?$('#rtype').value:'';await api('/trees/'+S.tree.id+'/persons',{method:'POST',body:JSON.stringify({first_name:$('#first').value,last_name:$('#last').value,gender:$('#gender').value,birth_date:$('#birth').value,death_date:$('#death').value,birth_place:$('#place').value,notes:$('#notes').value,photo_url:$('#photo').value,anchor_person_id:anchor,relation_type:rt,parent_direction:rt==='parent'?$('#parentDirection').value:'parent_to_child',spouse_start_date:rt==='spouse'?$('#spouseStart').value:''})});toast('Anggota berhasil ditambahkan.');openTree(S.tree.id,false)}catch(x){toast(x.message)}}
async function editPerson(id){let p=S.persons.find(x=>x.id===id);if(!p)return;$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Edit Anggota</h2><button class="ghost" type="button" onclick="closeModal()">Tutup</button></div><form class="form" onsubmit="savePerson(event,${id})"><label class="small muted">Gelar depan (opsional)</label><input id="etitlePrefix" placeholder="Contoh: Dr., H., Hj." value="${esc(p.title_prefix||'')}"><label class="small muted">Nama depan</label><input id="efirst" placeholder="Nama depan" value="${esc(p.first_name)}" required><label class="small muted">Nama belakang</label><input id="elast" placeholder="Nama belakang" value="${esc(p.last_name||'')}"><label class="small muted">Gelar belakang (opsional)</label><input id="etitleSuffix" placeholder="Contoh: S.E., S.H., M.Pd." value="${esc(p.title_suffix||'')}"><label class="small muted">Jenis kelamin</label><select id="egender"><option value="male" ${p.gender==='male'?'selected':''}>Laki-laki</option><option value="female" ${p.gender==='female'?'selected':''}>Perempuan</option><option value="other" ${p.gender==='other'?'selected':''}>Lainnya</option></select><label class="small muted">Tanggal lahir (opsional)</label><input id="ebirth" type="date" value="${esc(p.birth_date||'')}"><label class="small muted">Tanggal meninggal (opsional — bukan wajib)</label><input id="edeath" type="date" value="${esc(p.death_date||'')}"><input id="eplace" placeholder="Tempat lahir" value="${esc(p.birth_place||'')}"><textarea id="enotes" placeholder="Catatan">${esc(p.notes||'')}</textarea><input id="ephoto" placeholder="URL foto (opsional)" value="${esc(p.photo_url||'')}"><div class="notice small">Tanggal meninggal boleh dikosongkan dan tidak wajib diisi.</div><div class="actions"><button>Simpan perubahan</button><button class="ghost" type="button" onclick="closeModal()">Batal</button></div></form></div></div>`}
async function savePerson(e,id){e.preventDefault();try{await api('/persons/'+id,{method:'PATCH',body:JSON.stringify({first_name:$('#efirst').value,last_name:$('#elast').value,gender:$('#egender').value,birth_date:$('#ebirth').value,death_date:$('#edeath').value,birth_place:$('#eplace').value,notes:$('#enotes').value,photo_url:$('#ephoto').value,title_prefix:$('#etitlePrefix').value,title_suffix:$('#etitleSuffix').value})});closeModal();openTree(S.tree.id,false)}catch(x){toast(x.message)}}async function delPerson(id){if(!confirm('Hapus anggota dan relasinya?'))return;try{await api('/persons/'+id,{method:'DELETE'});openTree(S.tree.id,false)}catch(e){toast(e.message)}}
async function shareToggle(current){if(current){const ok=await askConfirm('Nonaktifkan publik?','Silsilah akan menjadi privat. Link publik tidak lagi dapat dibuka oleh umum.');if(!ok)return}try{let d=await api('/trees/'+S.tree.id+'/share',{method:'POST',body:JSON.stringify({is_public:!current})});toast(d.public?'Silsilah sekarang publik.':'Silsilah sekarang privat.');openTree(S.tree.id,false)}catch(e){toast(e.message)}}async function showMarriages(){const rows=S.rels.filter(r=>r.type==='spouse').map(r=>{const a=S.persons.find(p=>p.id===r.from_person_id),b=S.persons.find(p=>p.id===r.to_person_id);return {r,a,b}});$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Pasangan & Riwayat</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="hint">Laki-laki dapat memiliki beberapa istri. Seorang perempuan hanya memiliki satu suami aktif. Riwayat pasangan tetap disimpan.</p>${rows.map(x=>`<div class="item row"><div><b>${esc(full(x.a))} ↔ ${esc(full(x.b))}</b><div class="small muted">${x.r.spouse_status==='ended'?'Berakhir':'Aktif'}${x.r.start_date?' · mulai '+esc(x.r.start_date):''}${x.r.end_date?' · berakhir '+esc(x.r.end_date):''}</div></div>${x.r.spouse_status!=='ended'?`<button class="danger" onclick="endMarriage(${x.r.id})">Akhiri</button>`:''}</div>`).join('')||'<p class="muted">Belum ada hubungan pasangan.</p>'}<div class="notice">Untuk menikah lagi, hubungan pasangan sebelumnya harus sudah berakhir atau suami sebelumnya tercatat wafat.</div></div></div>`}
async function endMarriage(id){const d=new Date(),def=d.toISOString().slice(0,10);const end=prompt('Tanggal berakhir hubungan (YYYY-MM-DD)',def);if(end===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(end)){toast('Format tanggal harus YYYY-MM-DD.');return}try{await api('/relationships/'+id,{method:'PATCH',body:JSON.stringify({end_date:end})});toast('Hubungan pasangan diakhiri dan riwayat disimpan.');await openTree(S.tree.id,false);setTimeout(showMarriages,0)}catch(e){toast(e.message)}}
function showChildOrder(){const parents=S.persons.filter(p=>p.can_edit!==false&&S.rels.some(r=>r.type==='parent'&&r.from_person_id===p.id));if(!parents.length){toast('Belum ada hubungan orang tua → anak.');return}const opts=parents.map(p=>`<option value="${p.id}">${esc(full(p))}</option>`).join('');$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Atur Urutan Anak</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="hint">Pilih orang tua lalu gunakan tombol ↑/↓ untuk menentukan anak pertama hingga terakhir.</p><select id="orderParent" onchange="renderChildOrder()">${opts}</select><div id="orderList" class="order-list" style="margin-top:12px"></div></div></div>`;renderChildOrder()}function renderChildOrder(){const pid=Number($('#orderParent')?.value);if(!pid)return;const ids=S.rels.filter(r=>r.type==='parent'&&r.from_person_id===pid).map(r=>r.to_person_id);ids.sort((a,b)=>(Number(S.persons.find(p=>p.id===a)?.sibling_order||0)-Number(S.persons.find(p=>p.id===b)?.sibling_order||0))||String(full(S.persons.find(p=>p.id===a)||'')).localeCompare(String(full(S.persons.find(p=>p.id===b)||''))));$('#orderList').innerHTML=ids.map((id,i)=>{const p=S.persons.find(x=>x.id===id);return `<div class="order-row"><span><b>${i+1}.</b> ${esc(full(p))}</span><span class="actions"><button class="ghost" onclick="moveChild(${pid},${id},-1)" ${i===0?'disabled':''}>↑</button><button class="ghost" onclick="moveChild(${pid},${id},1)" ${i===ids.length-1?'disabled':''}>↓</button></span></div>`}).join('')}async function moveChild(parentId,childId,delta){let ids=S.rels.filter(r=>r.type==='parent'&&r.from_person_id===parentId).map(r=>r.to_person_id);ids.sort((a,b)=>(Number(S.persons.find(p=>p.id===a)?.sibling_order||0)-Number(S.persons.find(p=>p.id===b)?.sibling_order||0))||String(full(S.persons.find(p=>p.id===a)||'')).localeCompare(String(full(S.persons.find(p=>p.id===b)||''))));const i=ids.indexOf(childId),j=i+delta;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];try{await api('/trees/'+S.tree.id+'/children-order',{method:'PATCH',body:JSON.stringify({parentId,childIds:ids})});S.persons.forEach(p=>{const k=ids.indexOf(p.id);if(k>=0)p.sibling_order=k+1});renderChildOrder();toast('Urutan anak disimpan.')}catch(e){toast(e.message)}}
async function showClaims(){let r=await api('/trees/'+S.tree.id+'/claims');$('#app').insertAdjacentHTML('afterbegin',`<div class="card" id="claimPanel"><div class="row"><h3>Permintaan Klaim</h3><button class="ghost" onclick="$('#claimPanel').remove()">Tutup</button></div>${r.claims.map(c=>`<div class="item row"><span>${esc(c.requester_name)} ingin mengklaim <b>${esc(c.first_name+' '+c.last_name)}</b></span><span><button onclick="claimAction(${c.id},'approve')">Terima</button><button class="danger" onclick="claimAction(${c.id},'reject')">Tolak</button></span></div>`).join('')||'<p class="muted">Tidak ada permintaan.</p>'}</div>`)}async function claimAction(id,a){try{await api('/trees/'+S.tree.id+'/claims',{method:'POST',body:JSON.stringify({claimId:id,action:a})});toast(a==='approve'?'Family Member diterima.':'Permintaan ditolak.');await ownerAccountDash(S.tree)}catch(e){toast(e.message)}}async function showInvites(){let r=await api('/trees/'+S.tree.id+'/invites');let opts=S.persons.filter(p=>p.can_edit!==false).map(p=>`<option value="${p.id}">${esc(full(p))}</option>`).join('');$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Undang Family Member</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="muted">Pilih anggota yang sudah dibuat. Calon Family Member mendaftar sendiri, lalu Owner Akun menerima atau menolak permintaan.</p><form class="form" onsubmit="createInvite(event)"><label class="small muted">Anggota yang akan diwakili</label><select id="invitePerson" required><option value="">Pilih anggota...</option>${opts}</select><label class="small muted">Nomor WhatsApp</label><input id="invitePhone" inputmode="tel" placeholder="62812xxxx" required><div class="hint">Undangan Family Member dikirim melalui WhatsApp. Email tidak digunakan.</div><div class="actions"><button>Buat Undangan</button><button class="ghost" type="button" onclick="closeModal()">Batal</button></div></form><div class="notice"><b>Undangan & permintaan</b>${r.invites.map(i=>`<div class="item"><div class="row"><div><b>${esc(i.first_name+' '+i.last_name)}</b><div class="small muted">${esc(i.requester_name||i.invited_email||i.invited_phone||'-')} · ${i.requested_at?'Menunggu persetujuan Owner Akun':'Menunggu calon mendaftar'}</div></div><div class="actions"><button class="ghost" onclick="resendInvite(${i.id})">Kirim Ulang</button><button class="danger" onclick="deleteInvite(${i.id})">Hapus</button></div></div>${i.requested_at?`<div class="actions" style="margin-top:8px"><button onclick="inviteDecision(${i.id},'approve')">Terima</button><button class="danger" onclick="inviteDecision(${i.id},'reject')">Tolak</button></div>`:''}</div>`).join('')||'<div class="muted" style="margin-top:8px">Belum ada.</div>'}</div></div></div>`}function closeModal(){$('#modal').innerHTML=''}
async function sendInviteWhatsApp(phone,msg){const p=String(phone||'').replace(/[^0-9]/g,'');const u=p?`https://wa.me/${p}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;location.href=u}
async function createInvite(e){e.preventDefault();try{let d=await api('/trees/'+S.tree.id+'/invites',{method:'POST',body:JSON.stringify({personId:Number($('#invitePerson').value),phone:$('#invitePhone').value})});let msg=`Undangan JejakNasab untuk ${d.personName}. Daftar Family Member melalui link ini: ${d.inviteUrl}`;$('#modal').innerHTML=`<div class="modal"><div class="card"><h2>Undangan dibuat</h2><p class="muted">${esc(msg)}</p><div class="actions"><a class="link-button" href="https://wa.me/${String(d.phone).replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Kirim WhatsApp</a><button class="ghost" onclick="copyInviteText(${JSON.stringify(msg)})">Salin</button></div><button class="ghost" style="margin-top:10px" onclick="showInvites()">Selesai</button></div></div>`}catch(x){toast(x.message)}}

async function deleteInvite(id){const ok=await askConfirm('Hapus undangan?','Undangan ini akan dihapus dari daftar dan link undangan tidak dapat digunakan lagi.');if(!ok)return;try{await api('/trees/'+S.tree.id+'/invites/'+id,{method:'DELETE'});toast('Undangan dihapus.');showInvites()}catch(e){toast(e.message)}}
async function inviteDecision(id,action){try{await api('/trees/'+S.tree.id+'/invites/'+id,{method:'POST',body:JSON.stringify({action})});toast(action==='approve'?'Family Member diterima':'Permintaan ditolak');closeModal();await ownerAccountDash(S.tree)}catch(e){toast(e.message)}}
function privacySortedPersons(){const g=graphRows(S.persons,S.rels),out=[],seen=new Set();const visit=id=>{if(seen.has(id))return;const p=g.byId.get(id);if(!p)return;seen.add(id);out.push(p);for(const sid of g.spouses.get(id)||[])if(!seen.has(sid)){const sp=g.byId.get(sid);if(sp){seen.add(sid);out.push(sp)}}for(const cid of g.children.get(id)||[])visit(cid)};g.roots.forEach(r=>visit(r.id));S.persons.filter(p=>!seen.has(p.id)).sort((a,b)=>String(full(a)).localeCompare(String(full(b)))).forEach(p=>visit(p.id));return out}
function privacyChecks(prefix,v){return `<div class="check-grid"><label><input id="${prefix}_name" type="checkbox" ${v.show_name?'checked':''}> Nama</label><label><input id="${prefix}_age" type="checkbox" ${v.show_age?'checked':''}> Usia</label><label><input id="${prefix}_birth" type="checkbox" ${v.show_birth_date?'checked':''}> Tanggal lahir</label><label><input id="${prefix}_place" type="checkbox" ${v.show_birth_place?'checked':''}> Tempat lahir</label><label><input id="${prefix}_photo" type="checkbox" ${v.show_photo?'checked':''}> Foto</label><label><input id="${prefix}_notes" type="checkbox" ${v.show_notes?'checked':''}> Catatan</label></div>`}
function showPublicSettings(){const persons=privacySortedPersons();const rows=persons.map((p,i)=>`<div class="item row"><div><b>${i+1}. ${esc(full(p))}</b><div class="small muted">Nama & usia default · detail lainnya dapat diatur</div></div><button onclick="privacyPerson(${p.id})">Atur</button></div>`).join('');$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Pengaturan Info Publik</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="hint">Default aman: ☑ Nama · ☑ Usia · ☐ Tanggal lahir · ☐ Tempat lahir · ☐ Foto · ☐ Catatan. Hanya Owner Akun yang dapat mengubahnya.</p><div class="bulk-box"><b>Terapkan pengaturan ke semua anggota</b><span class="small muted">Atur satu kali, lalu gunakan untuk seluruh anggota.</span><button style="margin-top:10px" onclick="showBulkPrivacy()">Atur Semua Anggota</button></div>${rows||'<p class="muted">Belum ada anggota.</p>'}</div></div>`}
async function showBulkPrivacy(){let r=await api('/trees/'+S.tree.id+'/privacy');let v=r.privacy||{show_name:1,show_age:1,show_birth_date:0,show_birth_place:0,show_photo:0,show_notes:0};$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Info Publik Semua Anggota</h2><button class="ghost" onclick="showPublicSettings()">Kembali</button></div><p class="hint">Pengaturan ini diterapkan ke semua anggota. Default aman tetap Nama + Usia.</p>${privacyChecks('bulk',v)}<div class="actions" style="margin-top:14px"><button onclick="saveBulkPrivacy()">Terapkan ke Semua</button><button class="ghost" onclick="showPublicSettings()">Batal</button></div></div></div>`}
async function saveBulkPrivacy(){try{await api('/trees/'+S.tree.id+'/privacy',{method:'PATCH',body:JSON.stringify({show_name:$('#bulk_name').checked,show_age:$('#bulk_age').checked,show_birth_date:$('#bulk_birth').checked,show_birth_place:$('#bulk_place').checked,show_photo:$('#bulk_photo').checked,show_notes:$('#bulk_notes').checked})});toast('Pengaturan info publik semua anggota disimpan.');showPublicSettings()}catch(e){toast(e.message)}}
async function privacyPerson(id){let p=S.persons.find(x=>x.id===id);if(!p)return;let r=await api('/persons/'+id+'/privacy');let v=r.privacy||{};$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Info Publik: ${esc(full(p))}</h2><button class="ghost" onclick="showPublicSettings()">Kembali</button></div><p class="muted">Pilih informasi yang boleh terlihat setelah pengunjung mengetuk nama anggota. Tampilan pohon tetap ringkas: nama + usia.</p>${privacyChecks('pr',v)}<button style="margin-top:14px" onclick="savePrivacy(${id})">Simpan pengaturan</button></div></div>`}
async function savePrivacy(id){try{await api('/persons/'+id+'/privacy',{method:'PATCH',body:JSON.stringify({show_name:$('#pr_name').checked,show_age:$('#pr_age').checked,show_birth_date:$('#pr_birth').checked,show_birth_place:$('#pr_place').checked,show_photo:$('#pr_photo').checked,show_notes:$('#pr_notes').checked})});closeModal();toast('Pengaturan info publik disimpan')}catch(e){toast(e.message)}}
function showInviteRegister(tok){S.inviteToken=tok;try{localStorage.setItem('jn_pending_invite',tok)}catch{}$('#app').innerHTML=`<div class="card setup-card"><div class="setup-kicker">FAMILY MEMBER</div><h1>Daftar Family Member</h1><p class="setup-note">Buat akun untuk melanjutkan undangan ini.</p><form class="form" onsubmit="register(event)"><input id="rname" placeholder="Nama lengkap" required><input id="remail" type="email" placeholder="Email" required>${passwordField('rpass','Password minimal 8 karakter')}${passwordField('rpass2','Konfirmasi password')}<div class="notice"><b>Family Member</b><br>Akun akan menunggu persetujuan Owner Akun.</div><button type="submit">Daftar Family Member</button><button type="button" class="ghost" onclick="invitePage(${JSON.stringify(tok)})">Kembali</button></form></div>`}
async function publicTree(tok){$('#navActions').innerHTML='';try{const qs=new URLSearchParams(location.search),branchId=Number(qs.get('branch')||0),optionalId=Number(qs.get('optional')||0);let q=branchId?`?branch=${branchId}&v=${Date.now()}`:optionalId?`?optional=${optionalId}&v=${Date.now()}`:`?v=${Date.now()}`;let d=await api('/public/trees/'+encodeURIComponent(tok)+q);S.publicShareToken=tok;S.publicPersons=new Map((d.persons||[]).map(p=>[p.id,p]));if(d.branch){const node=p=>publicNode(p);$('#app').innerHTML=`<div class="public-card"><div class="public-head"><div class="eyebrow">CABANG KELUARGA</div><h2 style="margin:8px 0 10px;font-size:clamp(30px,7vw,50px)">${esc(d.tree.name)}</h2><p class="muted">Titik cabang: <b>${esc(d.tree.anchor_name||'anggota keluarga')}</b></p><div class="notice">Cabang ini memiliki batas 2 generasi ke atas + 2 ke bawah. Jalur saudara/pasangan saudara hanya dapat turun maksimal 2 generasi dan tidak dapat naik ke mertua.</div></div><div class="tree-toolbar"><button class="ghost tree-zoom" onclick="publicZoom(-0.1)">−</button><button class="ghost tree-zoom" onclick="publicZoom(0.1)">+</button><button class="ghost" onclick="publicZoomReset()">Reset</button></div><div class="tree-viewport no-border-tree" id="publicViewport"><div class="public-stage" id="publicStage"><div class="no-border-tree">${buildTreeLayout(d.persons,d.relationships,node,'',d.tree.root_person_id)}</div></div></div><div class="actions" style="margin-top:14px"><a class="link-button ghost" href="/f/${encodeURIComponent(tok)}">Kembali ke Silsilah Utama</a></div></div>`;window.publicScale=1;publicZoomReset();return}if(d.optional){const node=p=>publicNode(p);$('#app').innerHTML=`<div class="public-card"><div class="public-head"><div class="eyebrow">CABANG KELUARGA</div><h2 style="margin:8px 0 10px;font-size:clamp(30px,7vw,50px)">${esc(d.tree.name)}</h2><p class="muted">Titik cabang: <b>${esc(d.tree.anchor_name||'anggota keluarga')}</b></p></div><div class="tree-toolbar"><button class="ghost tree-zoom" onclick="publicZoom(-0.1)">−</button><button class="ghost tree-zoom" onclick="publicZoom(0.1)">+</button><button class="ghost" onclick="publicZoomReset()">Reset</button></div><div class="tree-viewport no-border-tree" id="publicViewport"><div class="public-stage" id="publicStage"><div class="no-border-tree">${buildTreeLayout(d.persons,d.relationships,node,'',d.tree.root_person_id)}</div></div></div><div class="actions" style="margin-top:14px"><a class="link-button ghost" href="/f/${encodeURIComponent(tok)}">Kembali ke Silsilah Utama</a></div></div>`;window.publicScale=1;publicZoomReset();return}S.publicBranches=d.branches||[];$('#app').innerHTML=`<div class="public-card"><div class="public-head"><div class="eyebrow">SILSILAH KELUARGA</div><h2 style="margin:8px 0 22px;font-size:clamp(32px,7vw,52px)">${esc(d.tree.name)}</h2><p class="muted">${esc(d.tree.description||'')}</p></div><div class="tree-toolbar"><button class="ghost tree-zoom" onclick="publicZoom(-0.1)">−</button><button class="ghost tree-zoom" onclick="publicZoom(0.1)">+</button><button class="ghost" onclick="publicZoomReset()">Reset</button></div><div class="tree-viewport no-border-tree" id="publicViewport"><div class="public-stage" id="publicStage"><div class="no-border-tree">${buildPublic(d.persons,d.relationships,d.tree.root_person_id)}</div></div></div><div class="notice">Profil publik mengikuti pengaturan privasi Owner.</div></div>`;window.publicScale=1;publicZoomReset()}catch(e){$('#app').innerHTML=`<div class="card"><h2>Silsilah tidak tersedia</h2><p>${esc(e.message)}</p></div>`}}
function publicPersonInfo(id){let p=S.publicPersons?.get(id);if(!p)return;const branch=S.publicBranches?.find(x=>Number(x.anchor_person_id)===Number(id));const optionalBtn=branch?`<div class="actions" style="margin-top:14px"><a class="link-button ghost" href="/f/${encodeURIComponent(S.publicShareToken)}?branch=${Number(branch.id)}" target="_blank" rel="noopener noreferrer">Lihat Cabang Keluarga ${esc(p.name)} ↗</a></div>`:'';const claim=p.claimable===undefined?'':p.isDeceased?'':p.claimable?`<div class="actions" style="margin-top:14px"><button onclick="claimPublicPerson(${p.id})">Klaim / Daftar Family Member</button></div>`:`<div class="notice" style="margin-top:14px">${p.claim_status==='claimed'?'Anggota ini sudah menjadi Family Member dan tidak dapat diklaim lagi.':'Klaim anggota ini sedang diproses oleh Owner Akun.'}</div>`;$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>${esc(p.name)}</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><div class="public-info">${p.photo_url?`<img class="photo" src="${esc(p.photo_url)}" alt="">`:''}${p.age!=null?`<div><b>Usia:</b> ${p.age} tahun${p.isDeceased?' (wafat)':''}${p.death_date?` · tahun wafat ${esc(String(p.death_date).slice(0,4))}`:''}</div>`:''}${p.birth_date?`<div><b>Tanggal lahir:</b> ${esc(p.birth_date)}</div>`:''}${p.death_date?`<div><b>Tanggal meninggal:</b> ${esc(p.death_date)}</div>`:''}${p.birth_place?`<div><b>Tempat lahir:</b> ${esc(p.birth_place)}</div>`:''}${p.notes?`<div><b>Catatan:</b><div style="white-space:pre-wrap;margin-top:5px">${esc(p.notes)}</div></div>`:''}</div>${optionalBtn}${claim}</div></div>`}async function claimPublicPerson(personId){const p=S.publicPersons?.get(personId);if(!p||p.isDeceased||!p.claimable){toast(p?.claim_status==='claimed'?'Anggota ini sudah menjadi Family Member.':'Klaim anggota ini sedang diproses.');return;}if(S.user){try{await api('/claims',{method:'POST',body:JSON.stringify({shareToken:S.publicShareToken,personId,note:''})});closeModal();toast('Permintaan klaim dikirim. Tunggu persetujuan Owner Akun.')}catch(e){toast(e.message)}}else{S.pendingClaim={shareToken:S.publicShareToken,personId};try{localStorage.setItem('jn_pending_claim',JSON.stringify(S.pendingClaim))}catch{}closeModal();showClaimRegister()}}
async function copyText(x){const text=String(x??'');if(!text)return false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch{}try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);const ok=document.execCommand('copy');ta.remove();if(ok)return true}catch{}return false}
async function copyWithFallback(text,targetId,label='Teks'){const value=String(text??'');if(!value)return toast(label+' tidak tersedia.');if(await copyText(value)){toast('✓ '+label+' berhasil disalin.');return true}$('#modal').innerHTML=`<div class="modal"><div class="card"><div class="row"><h2>Salin ${esc(label)}</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="hint">Browser tidak mengizinkan penyalinan otomatis. Tekan lama pada teks di bawah lalu pilih <b>Salin</b>.</p><textarea class="copy-target" style="width:100%;min-height:130px;padding:13px;border:1px solid var(--border);border-radius:12px;background:#081a2e;color:#fff" readonly onclick="this.select()">${esc(value)}</textarea><div class="actions" style="margin-top:10px"><button class="ghost" onclick="this.closest('.card').querySelector('textarea').select()">Pilih Teks</button>${navigator.share?'<button onclick="navigator.share({text:'+JSON.stringify(value)+'}).catch(()=>{})">Bagikan</button>':''}</div></div></div>`;setTimeout(()=>document.querySelector('.copy-target')?.select(),50);return false}
async function copyPublicLink(x){return copyWithFallback(x||$('#publicLinkInput')?.value||'','publicLinkInput','Link publik')}function openPublicLink(x){if(!x)return toast('Link publik belum tersedia.');const w=window.open(x,'_blank','noopener,noreferrer');if(!w)toast('Browser memblokir tab baru. Izinkan pop-up untuk membuka link publik.')}async function copyInviteText(text){return copyWithFallback(text,null,'Undangan')}
function buildPublic(ps,rs,rootId){return buildTreePublic(ps,rs,rootId)}function buildTreePublic(ps,rs,rootId){return buildTreeLayout(ps,rs,publicNode,'Anggota lain',rootId)||'<p class="muted">Belum ada jalur keluarga untuk ditampilkan.</p>'}function publicNode(p){const deathYear=p.death_date?String(p.death_date).slice(0,4):'';return `<div class="node public-person public-node" onclick="publicPersonInfo(${p.id})"><b>${esc(p.name)}</b>${p.age!=null?`<span>${p.isDeceased?`Wafat · ${p.age} tahun${deathYear?' · '+deathYear:''}`:`${p.age} tahun`}</span>`:''}</div>`}
document.addEventListener('click',e=>{if(!e.target.closest('.member-picker'))closeAnchorPicker()});
boot();
</script></body></html>
