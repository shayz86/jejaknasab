<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JejakNasab — Silsilah Keluarga Digital</title>
<style>
:root{--bg:#071426;--bg2:#0b1b31;--card:#12243b;--card2:#14283f;--text:#f4f7fb;--muted:#a5b2c5;--blue:#3f8cff;--blue2:#347ff0;--border:#243b57;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#0d2038 0,#071426 70%,#071426 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:var(--blue);color:white;font-weight:750}.ghost{background:transparent;color:#dce6f4;border:1px solid var(--border)}.danger{background:#4a1720;color:#fecaca}.wrap{width:min(100%,1120px);margin:auto;padding:0 22px}.nav{height:76px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:850;letter-spacing:-.4px}.brand span{color:#fff}.nav button{padding:9px 16px}.navActions{display:flex;align-items:center;gap:10px}.hero{padding:72px 0 56px;text-align:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#68a8ff;font-weight:800;margin-bottom:14px}.hero h1{font-size:clamp(40px,7vw,66px);line-height:1.03;letter-spacing:-2.6px;max-width:760px;margin:0 auto 22px}.hero p{font-size:16px;line-height:1.85;color:var(--muted);max-width:680px;margin:0 auto}.hero-actions{display:flex;justify-content:center;gap:10px;margin-top:27px;flex-wrap:wrap}.hero-actions button{min-width:178px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:76px}.feature,.package,.panel{background:linear-gradient(145deg,#12263e,#102238);border:1px solid var(--border);border-radius:15px}.feature{padding:22px 20px;min-height:130px}.feature h3{font-size:14px;margin:0 0 10px}.feature p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:0}.packages{padding:0 0 70px}.section-label{font-size:13px;color:#dce6f4;margin-bottom:6px}.section-title{font-size:20px;margin:0 0 20px;letter-spacing:-.3px}.package-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.package{padding:26px 20px;min-height:160px}.package.selected{border-color:#397fff;box-shadow:0 0 0 1px #397fff22}.package h3{margin:0 0 18px;font-size:16px}.package p{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0 0 15px}.package .tag{font-size:12px;font-weight:800}.card{background:linear-gradient(145deg,#12263e,#102238);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 12px 30px #0003}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:10px;background:#0b1a2e;color:var(--text);outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:#438cff}.muted{color:var(--muted)}.small{font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:var(--blue)}.tabs button{background:#172b43;color:#dce6f4;border:1px solid var(--border)}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:99px;background:#26384e;font-size:12px;font-weight:800}.active{background:#123b2a;color:#86efac}.pending{background:#473716;color:#fcd34d}.suspended{background:#461b23;color:#fca5a5}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--border);border-radius:12px;background:#0d1e33}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:12px;background:#0a1320;color:#fff;display:none;z-index:9;border:1px solid var(--border)}.treebox{overflow:auto;padding:18px;background:#0b1a2e;border:1px dashed #38516f;border-radius:15px;min-height:200px}.person{display:inline-flex;flex-direction:column;gap:4px;background:#12243b;border:1px solid #304963;border-radius:14px;padding:12px;margin:7px;min-width:150px;box-shadow:0 3px 12px #0003}.person b{font-size:15px}.auth-wrap{min-height:calc(100vh - 76px);display:flex;align-items:flex-start;justify-content:center;padding:55px 0}.auth-card{width:min(100%,540px)}.back-link{display:inline-block;margin-top:15px;color:#9fc5ff;cursor:pointer;font-size:13px}
@media(max-width:700px){.wrap{padding:0 14px}.nav{height:70px}.brand{font-size:19px}.navActions{gap:7px}.navActions .muted{display:none}.hero{padding:53px 0 51px}.hero h1{font-size:40px;letter-spacing:-1.8px;max-width:360px}.hero p{font-size:14px;line-height:1.8;max-width:350px}.hero-actions button{min-width:auto;padding:11px 17px}.features{grid-template-columns:1fr;gap:13px;padding-bottom:80px}.feature{padding:18px;min-height:108px}.packages{padding-bottom:45px}.package-grid{grid-template-columns:1fr}.package{min-height:0;padding:25px 19px}.auth-wrap{padding-top:28px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="nav"><div class="brand">JejakNasab</div><div id="navActions" class="navActions"></div></header>
<main id="app"></main>
</div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), api=async(path,opt={})=>{const r=await fetch('/api'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d};
let state={user:null,config:{price:50000,paymentInstructions:''},trees:[],currentTree:null,persons:[],rels:[]};
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function boot(){try{state.config=await api('/config');const m=await api('/me');state.user=m.user;render();}catch(e){toast(e.message)}}
function nav(){ $('#navActions').innerHTML=state.user?`<span class="muted small">${esc(state.user.name)} · ${state.user.role}</span><button class="ghost" onclick="logout()">Keluar</button>`:`<button class="ghost" onclick="showLogin()">Masuk</button><button onclick="showRegister()">Daftar</button>` }
function render(){nav();if(location.pathname.replace(/\/$/,'')==='/setup-owner'){setupOwnerPage();return}if(!state.user){home();return}dashboard()}
function home(){ $('#app').innerHTML=`
<section class="hero"><div class="eyebrow">SILSILAH KELUARGA DIGITAL</div><h1>Menjaga Jejak,<br>Menghubungkan Generasi.</h1><p>Bangun, simpan, dan wariskan silsilah keluarga Anda dalam satu tempat yang mudah digunakan dan dapat dikelola bersama keluarga.</p><div class="hero-actions"><button onclick="showRegister()">Mulai Membuat Silsilah</button><button class="ghost" onclick="showLogin()">Masuk</button></div></section>
<section class="features"><div class="feature"><h3>🌳 Pohon keluarga</h3><p>Hubungkan leluhur, pasangan, anak, dan cabang keluarga.</p></div><div class="feature"><h3>👨‍👩‍👧 Kolaborasi keluarga</h3><p>Kelola silsilah bersama anggota keluarga yang dipercaya.</p></div><div class="feature"><h3>🔐 Akses terkontrol</h3><p>Hak akses dapat dibedakan sesuai peran dan cabang keluarga.</p></div></section>
<section class="packages"><div class="section-label">Pilihan paket</div><h2 class="section-title">Pilih sesuai kebutuhan keluarga</h2><div class="package-grid"><div class="package"><h3>Premium</h3><p>Untuk keluarga yang ingin mulai membangun silsilah digital.</p><span class="tag">Premium</span></div><div class="package selected"><h3>Ultimate</h3><p>Untuk keluarga besar dengan kebutuhan pengelolaan yang lebih lengkap.</p><span class="tag">Ultimate</span></div></div></section>`}
function showLogin(){ $('#app').innerHTML=`<div class="auth-wrap"><div class="card auth-card"><h2>Masuk</h2><p class="muted">Masuk sebagai Owner atau Member aktif.</p><form class="form" onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button></form><span class="back-link" onclick="home()">← Kembali</span></div></div>`}
function showRegister(){ $('#app').innerHTML=`<div class="auth-wrap"><div class="card auth-card"><h2>Daftar Member</h2><p class="muted">Biaya pendaftaran: <b>Rp ${Number(state.config.price).toLocaleString('id-ID')}</b></p><form class="form" onsubmit="register(event)"><input id="name" placeholder="Nama lengkap" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password minimal 8 karakter" required><button>Daftar</button></form><p class="small muted">${esc(state.config.paymentInstructions)}</p><span class="back-link" onclick="home()">← Kembali</span></div></div>`}
function setupOwnerPage(){ $('#app').innerHTML=`<div class="auth-wrap"><div class="card auth-card"><div class="eyebrow">AKSES KHUSUS OWNER</div><h2>Setup Owner Pertama</h2><p class="muted">Halaman ini hanya dapat dibuka melalui URL khusus dan tidak ditampilkan di halaman utama.</p><form class="form" onsubmit="setupOwner(event)"><input id="setupKey" placeholder="OWNER_SETUP_KEY" required><input id="name" placeholder="Nama owner" required><input id="email" type="email" placeholder="Email owner" required><input id="password" type="password" minlength="8" placeholder="Password minimal 8 karakter" required><button>Buat Owner</button></form><span class="back-link" onclick="history.replaceState({},'', '/');render()">← Kembali ke halaman utama</span></div></div>` }
async function login(e){e.preventDefault();try{const d=await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});state.user=d.user;render();}catch(x){toast(x.message)}}
async function register(e){e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#password').value})});$('#app').innerHTML=`<div class="auth-wrap"><div class="card auth-card"><h2>Pendaftaran berhasil</h2><p class="muted">Akun Anda masih <b>pending</b>. Lakukan pembayaran sesuai instruksi, lalu Owner akan mengaktifkan akun.</p><button onclick="showLogin()">Ke Login</button></div></div>`}catch(x){toast(x.message)}}
async function setupOwner(e){e.preventDefault();try{await api('/setup-owner',{method:'POST',body:JSON.stringify({setupKey:$('#setupKey').value,name:$('#name').value,email:$('#email').value,password:$('#password').value})});toast('Owner berhasil dibuat');history.replaceState({},'', '/');showLogin()}catch(x){toast(x.message)}}
async function logout(){await api('/logout',{method:'POST'});state.user=null;render()}
async function dashboard(){await loadTrees();if(state.user.role==='owner')ownerView();else memberView()}
async function loadTrees(){state.trees=(await api('/trees')).trees}
function memberView(){ $('#app').innerHTML=`<div class="row"><div><h2>Dashboard Member</h2><p class="muted">Kelola pohon keluarga Anda.</p></div><button onclick="newTree()">+ Pohon Baru</button></div><div class="grid">${state.trees.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.description)}</p><button onclick="openTree(${t.id})">Buka Silsilah</button><button class="danger" onclick="delTree(${t.id})">Hapus</button></div>`).join('')||'<div class="card"><p>Belum ada pohon keluarga.</p></div>'}</div>`}
async function ownerView(){const u=(await api('/owner/users')).users;$('#app').innerHTML=`<div class="tabs"><button class="active" onclick="ownerView()">Member</button><button class="ghost" onclick="ownerTrees()">Semua Pohon</button></div><div class="card"><div class="row"><h2>Manajemen Member</h2><span class="pill">${u.length} member</span></div><div class="list">${u.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.email)} · ${x.payment_status} · Rp ${Number(x.amount||0).toLocaleString('id-ID')}</div></div><div><span class="pill ${x.status}">${x.status}</span> ${x.status==='active'?`<button class="danger" onclick="suspend(${x.id})">Tangguhkan</button>`:`<button onclick="activate(${x.id})">Aktifkan</button>`}</div></div>`).join('')||'<p class="muted">Belum ada member.</p>'}</div></div>`}
async function ownerTrees(){await loadTrees();$('#app').innerHTML=`<div class="tabs"><button onclick="ownerView()">Member</button><button class="active">Semua Pohon</button></div><div class="grid">${state.trees.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">Pemilik: ${esc(t.creator_name||'Anda')}</p><button onclick="openTree(${t.id})">Buka</button><button class="danger" onclick="delTree(${t.id})">Hapus</button></div>`).join('')||'<div class="card">Belum ada pohon.</div>'}</div>`}
async function activate(id){try{await api('/owner/users/activate',{method:'POST',body:JSON.stringify({userId:id})});toast('Member diaktifkan');ownerView()}catch(e){toast(e.message)}}
async function suspend(id){try{await api('/owner/users/suspend',{method:'POST',body:JSON.stringify({userId:id})});toast('Member ditangguhkan');ownerView()}catch(e){toast(e.message)}}
async function newTree(){const name=prompt('Nama pohon keluarga');if(!name)return;const description=prompt('Deskripsi singkat')||'';try{await api('/trees',{method:'POST',body:JSON.stringify({name,description})});dashboard()}catch(e){toast(e.message)}}
async function delTree(id){if(!confirm('Hapus pohon dan seluruh datanya?'))return;try{await api('/trees/'+id,{method:'DELETE'});dashboard()}catch(e){toast(e.message)}}
async function openTree(id){state.currentTree=id;state.persons=(await api('/trees/'+id+'/persons')).persons;state.rels=(await api('/trees/'+id+'/relationships')).relationships;const t=state.trees.find(x=>x.id===id);$('#app').innerHTML=`<div class="row"><div><h2>${esc(t?.name||'Silsilah')}</h2><p class="muted">${esc(t?.description||'')}</p></div><button class="ghost" onclick="dashboard()">Kembali</button></div><div class="grid"><div class="card"><h3>Tambah Anggota Keluarga</h3><form class="form" onsubmit="addPerson(event)"><input id="first" placeholder="Nama depan" required><input id="last" placeholder="Nama belakang"><select id="gender"><option value="male">Laki-laki</option><option value="female">Perempuan</option><option value="other">Lainnya</option></select><input id="birth" placeholder="Tanggal lahir, contoh 1950-01-01"><input id="place" placeholder="Tempat lahir"><textarea id="notes" placeholder="Catatan"></textarea><button>Tambah</button></form></div><div class="card"><h3>Hubungkan Relasi</h3><form class="form" onsubmit="addRel(event)"><select id="from">${state.persons.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select><select id="type"><option value="parent">Orang tua → anak</option><option value="spouse">Pasangan</option></select><select id="to">${state.persons.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select><button>Hubungkan</button></form><p class="small muted">Untuk parent, pilih orang tua sebagai "dari" dan anak sebagai "ke".</p></div></div><div class="card" style="margin-top:18px"><h3>Anggota</h3><div class="treebox">${state.persons.map(p=>`<div class="person"><b>${esc(p.first_name+' '+p.last_name)}</b><span class="small">${p.gender==='male'?'♂':p.gender==='female'?'♀':'•'} ${esc(p.birth_date||'')}</span><span class="small muted">${esc(p.birth_place||'')}</span><button class="danger small" onclick="delPerson(${p.id})">Hapus</button></div>`).join('')||'<p class="muted">Belum ada anggota.</p>'}</div></div><div class="card" style="margin-top:18px"><h3>Relasi</h3><div class="list">${state.rels.map(r=>{const a=state.persons.find(p=>p.id===r.from_person_id),b=state.persons.find(p=>p.id===r.to_person_id);return `<div class="item">${esc(a?.first_name+' '+(a?.last_name||''))} <b>→ ${r.type==='parent'?'orang tua':'pasangan'} →</b> ${esc(b?.first_name+' '+(b?.last_name||''))}</div>`}).join('')||'<p class="muted">Belum ada relasi.</p>'}</div></div>`}
async function addPerson(e){e.preventDefault();try{await api('/trees/'+state.currentTree+'/persons',{method:'POST',body:JSON.stringify({first_name:$('#first').value,last_name:$('#last').value,gender:$('#gender').value,birth_date:$('#birth').value,birth_place:$('#place').value,notes:$('#notes').value})});openTree(state.currentTree)}catch(x){toast(x.message)}}
async function addRel(e){e.preventDefault();try{await api('/trees/'+state.currentTree+'/relationships',{method:'POST',body:JSON.stringify({from_person_id:$('#from').value,to_person_id:$('#to').value,type:$('#type').value})});openTree(state.currentTree)}catch(x){toast(x.message)}}
async function delPerson(id){if(!confirm('Hapus anggota ini?'))return;try{await api('/persons/'+id,{method:'DELETE'});openTree(state.currentTree)}catch(e){toast(e.message)}}
boot();
</script></body></html>
