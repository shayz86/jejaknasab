<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JejakNasab — Silsilah Keluarga</title>
<style>
:root{--bg:#061426;--bg2:#0a1b31;--card:#11243c;--card2:#132943;--text:#f5f8ff;--muted:#9eacc1;--blue:#3d8cff;--blue2:#6aa9ff;--line:#213b5a;--danger:#ff6b7a;--ok:#49d28b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--blue);color:#fff;font-weight:800}.ghost{background:transparent;color:#dce8f8;border:1px solid var(--line)}.danger{background:#351b24;color:#ffb6bf;border:1px solid #63313d}.wrap{max-width:1100px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:4px 0 24px}.brand{font-size:20px;font-weight:900;letter-spacing:-.5px}.navlinks{display:flex;align-items:center;gap:10px}.navlinks button{padding:9px 15px}.navlinks .login{background:transparent}.navlinks .register{background:var(--blue)}.hero{padding:38px 0 42px;text-align:center}.eyebrow{font-size:12px;letter-spacing:2.4px;font-weight:900;color:#62a8ff;margin-bottom:16px}.hero h1{font-size:clamp(40px,7vw,70px);line-height:1.02;letter-spacing:-2.8px;max-width:820px;margin:0 auto 22px}.hero p{font-size:17px;line-height:1.75;color:var(--muted);max-width:720px;margin:0 auto 28px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{min-width:160px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0 78px}.feature,.plan,.panel{background:linear-gradient(180deg,var(--card),#0f2138);border:1px solid var(--line);border-radius:17px;padding:20px}.feature h3{margin:0 0 10px;font-size:15px}.feature p,.plan p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}.section-label{color:#d7dfeb;font-size:13px;margin-bottom:5px}.section-title{font-size:23px;margin:0 0 18px}.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.plan{padding:22px 20px;min-height:155px}.plan h3{font-size:16px;margin:0 0 12px}.plan .price{margin-top:14px;color:#f2f6ff;font-weight:800}.plan.ultimate{border-color:#3d83e8;box-shadow:0 0 0 1px #173e73 inset}.panel{max-width:660px;margin:40px auto;padding:32px}.setup-panel{background:linear-gradient(180deg,#132943,#10243c)}.setup-panel .eyebrow{text-align:left;font-size:13px;margin-bottom:28px}.setup-panel h1{font-size:40px;letter-spacing:-1.2px;margin:0 0 28px}.setup-panel .intro{font-size:17px;line-height:1.45;color:#b0bfd3;margin-bottom:28px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #294461;background:#091b30;color:#fff;outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--blue)}.form input::placeholder{color:#8999ad}.setup-panel .form input:first-child{background:#eaf1fb;color:#172238}.form button{font-size:17px;padding:14px}.back{display:inline-block;margin-top:24px;color:#a8c7f5;text-decoration:none}.back:hover{text-decoration:underline}.message{display:none;margin-top:14px;border-radius:12px;padding:13px 15px;line-height:1.45;font-size:14px}.message.error{display:block;background:#321a22;border:1px solid #69313e;color:#ffbec6}.message.ok{display:block;background:#102e27;border:1px solid #235f4d;color:#a9f0cf}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0d2036}.pill{padding:5px 9px;border-radius:99px;background:#24364d;font-size:12px;font-weight:800}.pill.active{background:#123e2e;color:#8ce8bd}.pill.pending{background:#463719;color:#ffd87a}.pill.suspended{background:#45202a;color:#ffabb7}.treebox{overflow:auto;padding:14px;background:#091a2e;border:1px dashed #2b4563;border-radius:15px;min-height:180px}.person{display:inline-flex;flex-direction:column;gap:4px;background:#112842;border:1px solid #294461;border-radius:14px;padding:12px;margin:6px;min-width:150px}.person b{font-size:15px}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:12px;background:#101d2e;border:1px solid #2d4562;color:#fff;display:none;z-index:20;max-width:calc(100vw - 36px)}
@media(max-width:700px){.wrap{padding:14px}.nav{padding-bottom:18px}.features,.plans{grid-template-columns:1fr}.features{margin-bottom:58px}.hero{padding-top:42px}.hero h1{font-size:43px;letter-spacing:-1.8px}.hero p{font-size:16px}.panel{padding:24px 18px;margin:28px auto}.setup-panel h1{font-size:36px}.navlinks .login{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="nav"><div class="brand">JejakNasab</div><div id="navActions" class="navlinks"></div></header>
<main id="app"></main>
</div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);
const api=async(path,opt={})=>{const r=await fetch('/api'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d};
let state={user:null,config:{price:50000,paymentInstructions:''},trees:[],currentTree:null,persons:[],rels:[]};
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',4000)}
function setMessage(type,text){const m=$('#setupMessage');if(!m)return;m.className='message '+type;m.textContent=text;m.style.display='block'}
function nav(){if(location.pathname==='/setup-owner'){$('#navActions').innerHTML='';return}$('#navActions').innerHTML=state.user?`<span class="muted small">${esc(state.user.name)} · ${esc(state.user.role)}</span><button class="ghost" onclick="logout()">Keluar</button>`:`<button class="login" onclick="showLogin()">Masuk</button><button class="register" onclick="showRegister()">Daftar</button>`}
function home(){nav();$('#app').innerHTML=`<section class="hero"><div class="eyebrow">SILSILAH KELUARGA DIGITAL</div><h1>Menjaga Jejak,<br>Menghubungkan Generasi.</h1><p>Bangun, simpan, dan wariskan silsilah keluarga Anda dalam satu tempat yang mudah digunakan dan dapat dikelola bersama keluarga.</p><div class="actions"><button onclick="showRegister()">Mulai Membuat Silsilah</button><button class="ghost" onclick="showLogin()">Masuk</button></div></section><section class="features"><article class="feature"><h3>🌳 Pohon keluarga</h3><p>Hubungkan leluhur, pasangan, anak, dan cabang keluarga.</p></article><article class="feature"><h3>👨‍👩‍👧 Kolaborasi keluarga</h3><p>Kelola silsilah bersama anggota keluarga yang dipercaya.</p></article><article class="feature"><h3>🔐 Akses terkontrol</h3><p>Hak akses dapat dibedakan sesuai peran dan cabang keluarga.</p></article></section><section><div class="section-label">Pilihan paket</div><h2 class="section-title">Pilih sesuai kebutuhan keluarga</h2><div class="plans"><article class="plan"><h3>Premium</h3><p>Untuk keluarga yang ingin mulai membangun silsilah digital.</p><div class="price">Premium</div></article><article class="plan ultimate"><h3>Ultimate</h3><p>Untuk keluarga besar dengan kebutuhan pengelolaan yang lebih lengkap.</p><div class="price">Ultimate</div></article></div></section>`}
function setupPage(){nav();$('#app').innerHTML=`<section class="panel setup-panel"><div class="eyebrow">AKSES KHUSUS OWNER</div><h1>Setup Owner Pertama</h1><p class="intro">Halaman ini hanya dapat dibuka melalui URL khusus dan tidak ditampilkan di halaman utama.</p><form class="form" onsubmit="setupOwner(event)"><input id="setupKey" placeholder="OWNER_SETUP_KEY" autocomplete="off" required><input id="ownerName" placeholder="Nama owner" autocomplete="name" required><input id="ownerEmail" type="email" placeholder="Email owner" autocomplete="email" required><input id="ownerPassword" type="password" minlength="8" placeholder="Password minimal 8 karakter" autocomplete="new-password" required><button type="submit">Buat Owner</button></form><div id="setupMessage" class="message"></div><a class="back" href="/">← Kembali ke halaman utama</a></section>`}
function showLogin(){nav();$('#app').innerHTML=`<div class="panel"><div class="eyebrow">AKSES MEMBER & OWNER</div><h1 style="margin:0 0 10px">Masuk</h1><p class="muted">Gunakan email dan password akun yang sudah aktif.</p><form class="form" onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button></form><button class="ghost" style="margin-top:12px" onclick="home()">Kembali</button></div>`}
function showRegister(){nav();$('#app').innerHTML=`<div class="panel"><div class="eyebrow">MEMBER BERBAYAR</div><h1 style="margin:0 0 10px">Daftar Member</h1><p class="muted">Biaya pendaftaran: <b>Rp ${Number(state.config.price).toLocaleString('id-ID')}</b></p><form class="form" onsubmit="register(event)"><input id="name" placeholder="Nama lengkap" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password minimal 8 karakter" required><button>Daftar</button></form><p class="small muted" style="margin-top:14px">${esc(state.config.paymentInstructions)}</p><button class="ghost" onclick="home()">Kembali</button></div>`}
async function setupOwner(e){e.preventDefault();const b={setupKey:$('#setupKey').value.trim(),name:$('#ownerName').value.trim(),email:$('#ownerEmail').value.trim(),password:$('#ownerPassword').value};setMessage('ok','Memproses pembuatan Owner...');try{const d=await api('/setup-owner',{method:'POST',body:JSON.stringify(b)});setMessage('ok',d.message||'Owner berhasil dibuat. Silakan kembali ke halaman utama untuk login.');$('#setupKey').value='';$('#ownerPassword').value='';}catch(x){setMessage('error',x.message)}}
async function login(e){e.preventDefault();try{const d=await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});state.user=d.user;render();}catch(x){toast(x.message)}}
async function register(e){e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#password').value})});$('#app').innerHTML=`<div class="panel"><h1 style="margin:0 0 10px">Pendaftaran berhasil</h1><p>Akun Anda masih <b>pending</b>. Lakukan pembayaran sesuai instruksi, lalu owner akan mengaktifkan akun.</p><button onclick="showLogin()">Ke Login</button></div>`}catch(x){toast(x.message)}}
async function logout(){try{await api('/logout',{method:'POST'})}finally{state.user=null;render()}}
function render(){if(location.pathname==='/setup-owner'){setupPage();return}if(!state.user){home();return}dashboard()}
async function boot(){if(location.pathname==='/setup-owner'){setupPage();return}try{state.config=await api('/config');const m=await api('/me');state.user=m.user;render()}catch(e){toast(e.message);home()}}
async function dashboard(){nav();try{await loadTrees();if(state.user.role==='owner')ownerView();else memberView()}catch(e){toast(e.message)}}
async function loadTrees(){state.trees=(await api('/trees')).trees}
function memberView(){$('#app').innerHTML=`<div class="row"><div><h2>Dashboard Member</h2><p class="muted">Kelola pohon keluarga Anda.</p></div><button onclick="newTree()">+ Pohon Baru</button></div><div class="grid" style="margin-top:18px">${state.trees.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.description)}</p><button onclick="openTree(${t.id})">Buka Silsilah</button><button class="danger" onclick="delTree(${t.id})">Hapus</button></div>`).join('')||'<div class="card"><p>Belum ada pohon keluarga.</p></div>'}</div>`}
async function ownerView(){const u=(await api('/owner/users')).users;$('#app').innerHTML=`<div class="tabs"><button class="active">Member</button><button class="ghost" onclick="ownerTrees()">Semua Pohon</button></div><div class="card"><div class="row"><h2>Manajemen Member</h2><span class="pill">${u.length} member</span></div><div class="list" style="margin-top:15px">${u.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.email)} · ${x.payment_status} · Rp ${Number(x.amount||0).toLocaleString('id-ID')}</div></div><div><span class="pill ${x.status}">${x.status}</span> ${x.status==='active'?`<button class="danger" onclick="suspend(${x.id})">Tangguhkan</button>`:`<button onclick="activate(${x.id})">Aktifkan</button>`}</div></div>`).join('')||'<p class="muted">Belum ada member.</p>'}</div></div>`}
async function ownerTrees(){await loadTrees();$('#app').innerHTML=`<div class="tabs"><button onclick="ownerView()">Member</button><button class="active">Semua Pohon</button></div><div class="grid">${state.trees.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">Pemilik: ${esc(t.creator_name||'Anda')}</p><button onclick="openTree(${t.id})">Buka</button><button class="danger" onclick="delTree(${t.id})">Hapus</button></div>`).join('')||'<div class="card">Belum ada pohon.</div>'}</div>`}
async function activate(id){try{await api('/owner/users/activate',{method:'POST',body:JSON.stringify({userId:id})});toast('Member diaktifkan');ownerView()}catch(e){toast(e.message)}}
async function suspend(id){try{await api('/owner/users/suspend',{method:'POST',body:JSON.stringify({userId:id})});toast('Member ditangguhkan');ownerView()}catch(e){toast(e.message)}}
async function newTree(){const name=prompt('Nama pohon keluarga');if(!name)return;const description=prompt('Deskripsi singkat')||'';try{await api('/trees',{method:'POST',body:JSON.stringify({name,description})});dashboard()}catch(e){toast(e.message)}}
async function delTree(id){if(!confirm('Hapus pohon dan seluruh datanya?'))return;try{await api('/trees/'+id,{method:'DELETE'});dashboard()}catch(e){toast(e.message)}}
async function openTree(id){state.currentTree=id;try{state.persons=(await api('/trees/'+id+'/persons')).persons;state.rels=(await api('/trees/'+id+'/relationships')).relationships}catch(e){toast(e.message);return}const t=state.trees.find(x=>x.id===id);$('#app').innerHTML=`<div class="row"><div><h2>${esc(t?.name||'Silsilah')}</h2><p class="muted">${esc(t?.description||'')}</p></div><button class="ghost" onclick="dashboard()">Kembali</button></div><div class="grid" style="margin-top:18px"><div class="card"><h3>Tambah Anggota Keluarga</h3><form class="form" onsubmit="addPerson(event)"><input id="first" placeholder="Nama depan" required><input id="last" placeholder="Nama belakang"><select id="gender"><option value="male">Laki-laki</option><option value="female">Perempuan</option><option value="other">Lainnya</option></select><input id="birth" placeholder="Tanggal lahir, contoh 1950-01-01"><input id="place" placeholder="Tempat lahir"><textarea id="notes" placeholder="Catatan"></textarea><button>Tambah</button></form></div><div class="card"><h3>Hubungkan Relasi</h3><form class="form" onsubmit="addRel(event)"><select id="from">${state.persons.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select><select id="type"><option value="parent">Orang tua → anak</option><option value="spouse">Pasangan</option></select><select id="to">${state.persons.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select><button>Hubungkan</button></form></div></div><div class="card" style="margin-top:18px"><h3>Anggota</h3><div class="treebox">${state.persons.map(p=>`<div class="person"><b>${esc(p.first_name+' '+p.last_name)}</b><span class="small">${p.gender==='male'?'♂':p.gender==='female'?'♀':'•'} ${esc(p.birth_date||'')}</span><span class="small muted">${esc(p.birth_place||'')}</span><button class="danger small" onclick="delPerson(${p.id})">Hapus</button></div>`).join('')||'<p class="muted">Belum ada anggota.</p>'}</div></div><div class="card" style="margin-top:18px"><h3>Relasi</h3><div class="list">${state.rels.map(r=>{const a=state.persons.find(p=>p.id===r.from_person_id),b=state.persons.find(p=>p.id===r.to_person_id);return `<div class="item">${esc(a?.first_name+' '+(a?.last_name||''))} <b>→ ${r.type==='parent'?'orang tua':'pasangan'} →</b> ${esc(b?.first_name+' '+(b?.last_name||''))}</div>`}).join('')||'<p class="muted">Belum ada relasi.</p>'}</div></div>`}
async function addPerson(e){e.preventDefault();try{await api('/trees/'+state.currentTree+'/persons',{method:'POST',body:JSON.stringify({first_name:$('#first').value,last_name:$('#last').value,gender:$('#gender').value,birth_date:$('#birth').value,birth_place:$('#place').value,notes:$('#notes').value})});openTree(state.currentTree)}catch(x){toast(x.message)}}
async function addRel(e){e.preventDefault();try{await api('/trees/'+state.currentTree+'/relationships',{method:'POST',body:JSON.stringify({from_person_id:$('#from').value,to_person_id:$('#to').value,type:$('#type').value})});openTree(state.currentTree)}catch(x){toast(x.message)}}
async function delPerson(id){if(!confirm('Hapus anggota ini?'))return;try{await api('/persons/'+id,{method:'DELETE'});openTree(state.currentTree)}catch(e){toast(e.message)}}
boot();
</script></body></html>
