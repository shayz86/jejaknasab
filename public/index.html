<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JejakNasab — Silsilah Keluarga</title><style>
:root{--bg:#071427;--card:#122943;--card2:#0d2138;--text:#f4f7fb;--muted:#9fb0c7;--primary:#3f8cff;--border:#23415f;--danger:#4b1722;--ok:#123d2c}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#0b1d33,#071427 65%,#061120);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid transparent;border-radius:12px;padding:12px 16px;background:var(--primary);color:#fff;font-weight:800}.ghost{background:#0d2036;color:#dbe7f5;border-color:#29445f}.danger{background:var(--danger);color:#ffc3cb;border-color:#71303c}.wrap{max-width:1120px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-size:25px;font-weight:900;letter-spacing:-.5px}.hero{padding:24px 0 54px}.hero-inner{text-align:center;max-width:760px;margin:auto}.eyebrow,.setup-kicker{font-size:12px;letter-spacing:2.5px;color:#5da0ff;font-weight:900;margin-bottom:16px}.hero h1{font-size:clamp(42px,8vw,64px);line-height:1.03;letter-spacing:-2.5px;margin:0 0 18px}.hero p{font-size:17px;line-height:1.8;color:var(--muted)}.hero-actions,.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.feature-grid,.package-grid,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature-card,.package-card,.card{background:linear-gradient(180deg,#132a45,#10253d);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 30px #0004}.feature-card{padding:20px;min-height:130px}.feature-card h3,.package-card h3{margin:0 0 10px}.feature-card p,.package-card p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}.packages{margin-top:76px}.section-kicker{font-size:13px}.section-title{font-size:22px;margin:5px 0 20px}.package-grid{grid-template-columns:repeat(2,1fr)}.package-card{padding:22px}.featured{border-color:#3f8cff;box-shadow:0 0 0 1px #3f8cff33}.price{font-size:27px;font-weight:900;margin:15px 0 8px;color:#66a5ff}.card{padding:24px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid #29445f;border-radius:12px;background:#081a2e;color:#f5f8fc;outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:#4c96ff;box-shadow:0 0 0 3px #3f8cff22}.setup-card{max-width:660px;margin:58px auto 0}.setup-card h1{font-size:clamp(34px,7vw,52px);line-height:1.05;margin:20px 0 24px}.setup-note{font-size:17px;line-height:1.7;color:#aebed2}.setup-back{display:inline-block;margin-top:18px;color:#a9c8f6;text-decoration:none}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:99px;background:#1c3148;font-size:12px;font-weight:800}.active{background:#123d2c;color:#8be0b5}.pending{background:#4a3b12;color:#f7d77a}.suspended{background:#451b24;color:#ffadb9}.item{padding:14px;border:1px solid var(--border);border-radius:12px;background:#0c2036;margin-bottom:10px}.muted{color:var(--muted)}.small{font-size:12px}.tree-wrap{overflow:auto;background:#081a2e;border:1px dashed #35516d;border-radius:16px;padding:22px;min-height:360px}.tree-canvas{min-width:760px;padding:25px}.tree-level{display:flex;justify-content:center;gap:18px;position:relative;margin:16px 0}.node{width:180px;padding:14px;border:1px solid #315575;background:#112b48;border-radius:15px;text-align:center;box-shadow:0 8px 18px #0003}.node b{display:block;font-size:15px}.node span{display:block;color:#9fb0c7;font-size:12px;margin-top:5px}.couple{display:flex;align-items:center;gap:8px}.couple:after{content:'♥';color:#6fa9ff}.line{height:18px;border-left:2px solid #35516d;margin:auto}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.privacy{display:grid;gap:8px;margin-top:12px}.privacy label{display:flex;gap:8px;align-items:center;color:#dce7f5}.notice{padding:13px 15px;border-radius:12px;background:#0c2036;border:1px solid var(--border);margin:12px 0}.notice.ok{background:var(--ok);color:#b6f0d0}.public-card{max-width:1100px;margin:auto}.public-head{text-align:center;margin-bottom:22px}.public-tree{display:grid;gap:18px}.public-person{cursor:pointer}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:12px;background:#101c2b;color:#fff;border:1px solid #34506c;display:none;z-index:9;max-width:min(92vw,520px)}.toast.error{background:#3a1720;border-color:#71303c;color:#ffc0c8}@media(max-width:760px){.wrap{padding:15px}.feature-grid,.package-grid,.grid,.editor-grid{grid-template-columns:1fr}.hero{padding-top:22px}.hero h1{font-size:clamp(42px,13vw,58px)}.card{padding:20px}.setup-card{margin-top:34px}.nav{margin-bottom:10px}}
</style></head><body><div class="wrap"><div class="nav"><div class="brand">JejakNasab</div><div id="navActions"></div></div><main id="app"></main></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s),api=async(path,opt={})=>{const r=await fetch('/api'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d};let S={user:null,config:null,trees:[],tree:null,persons:[],rels:[]};
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])}function toast(x){let t=$('#toast');t.textContent=x;t.classList.toggle('error',/gagal|salah|belum|tidak|error/i.test(x));t.style.display='block';setTimeout(()=>t.style.display='none',4200)}function full(p){return [p.first_name,p.last_name].filter(Boolean).join(' ')}function age(b,d=''){if(!b)return null;let a=new Date(b+'T00:00:00'),z=d?new Date(d+'T00:00:00'):new Date();if(isNaN(a)||isNaN(z))return null;let n=z.getFullYear()-a.getFullYear();if(z.getMonth()<a.getMonth()||(z.getMonth()===a.getMonth()&&z.getDate()<a.getDate()))n--;return n}
async function boot(){let path=location.pathname.replace(/\/$/,'');if(path==='/setup-owner')return ownerSetup();if(path.startsWith('/f/'))return publicTree(path.slice(3));try{S.config=await api('/config');S.user=(await api('/me')).user;render()}catch(e){toast(e.message)}}function nav(){let n=$('#navActions');if(!S.user){n.innerHTML='<button class="ghost" onclick="showLogin()">Masuk</button> <button onclick="showRegister()">Daftar</button>'}else n.innerHTML=`<span class="muted">${esc(S.user.name)} · ${S.user.role==='owner'?'Owner Web':'Member'}</span> <button class="ghost" onclick="logout()">Keluar</button>`}
function render(){nav();if(!S.user)return home();S.user.role==='owner'?ownerDash():memberDash()}function home(){$('#app').innerHTML=`<section class="hero"><div class="hero-inner"><div class="eyebrow">SILSILAH KELUARGA DIGITAL</div><h1>Menjaga Jejak,<br>Menghubungkan Generasi.</h1><p>Bangun, simpan, dan wariskan silsilah keluarga Anda dalam satu tempat yang mudah digunakan dan dapat dikelola bersama keluarga.</p><div class="hero-actions"><button onclick="showRegister()">Mulai Membuat Silsilah</button><button class="ghost" onclick="showLogin()">Masuk</button></div></div></section><section class="feature-grid"><div class="feature-card"><h3>🌳 Pohon keluarga</h3><p>Hubungkan leluhur, pasangan, anak, saudara, dan cabang keluarga.</p></div><div class="feature-card"><h3>👨‍👩‍👧 Kolaborasi keluarga</h3><p>Owner dapat mengundang dan menerima Family Member dengan hak akses terkontrol.</p></div><div class="feature-card"><h3>🔐 Akses terkontrol</h3><p>Family Member hanya dapat mengelola wilayah silsilah sesuai paket.</p></div></section><section class="packages"><div class="section-kicker">Pilihan paket</div><h2 class="section-title">Pilih sesuai kebutuhan keluarga</h2><div class="package-grid"><div class="package-card"><h3>Premium</h3><p>Untuk keluarga yang ingin mulai membangun silsilah digital.</p><div class="price">Rp ${Number(S.config?.premium?.price||50000).toLocaleString('id-ID')}</div><div class="muted">10 Family Member · 3 generasi atas & 3 bawah</div></div><div class="package-card featured"><h3>Ultimate</h3><p>Untuk keluarga besar dengan kebutuhan pengelolaan yang lebih luas.</p><div class="price">Rp ${Number(S.config?.ultimate?.price||100000).toLocaleString('id-ID')}</div><div class="muted">20 Family Member · 6 generasi atas & 6 bawah</div></div></div></section>`}
function showLogin(){nav();$('#app').innerHTML=`<div class="card" style="max-width:520px;margin:auto"><h2>Masuk</h2><form class="form" onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button></form><button class="ghost" style="margin-top:10px" onclick="home()">Kembali</button></div>`}function showRegister(){let c=S.config;$('#app').innerHTML=`<div class="card" style="max-width:620px;margin:auto"><h2>Daftar Member</h2><p class="muted">Pilih paket. Akun aktif setelah pembayaran diverifikasi Owner Web.</p><form class="form" onsubmit="register(event)"><input id="name" placeholder="Nama lengkap" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password minimal 8 karakter" required><select id="plan"><option value="premium">Premium — Rp ${Number(c.premium.price).toLocaleString('id-ID')} · 10 member · 3/3 generasi</option><option value="ultimate">Ultimate — Rp ${Number(c.ultimate.price).toLocaleString('id-ID')} · 20 member · 6/6 generasi</option></select><button>Daftar</button></form><div class="notice">${esc(c.paymentInstructions)}</div><button class="ghost" onclick="home()">Kembali</button></div>`}
function ownerSetup(){$('#navActions').innerHTML='';$('#app').innerHTML=`<div class="card setup-card"><div class="setup-kicker">AKSES KHUSUS OWNER</div><h1>Setup Owner Pertama</h1><p class="setup-note">Halaman ini hanya dapat dibuka melalui URL khusus dan tidak ditampilkan di halaman utama.</p><form class="form" onsubmit="setup(event)"><input id="setupKey" placeholder="OWNER_SETUP_KEY" required><input id="name" placeholder="Nama owner" required><input id="email" type="email" placeholder="Email owner" required><input id="password" type="password" minlength="8" placeholder="Password minimal 8 karakter" required><button>Buat Owner</button></form><a class="setup-back" href="/">← Kembali ke halaman utama</a></div>`}
async function login(e){e.preventDefault();try{let d=await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});S.user=d.user;render()}catch(x){toast(x.message)}}async function register(e){e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#password').value,plan:$('#plan').value})});$('#app').innerHTML=`<div class="card"><h2>Pendaftaran berhasil</h2><p>Akun <b>${esc($('#plan').value)}</b> masih <b>pending</b>. Lakukan pembayaran sesuai instruksi.</p><div class="notice">${esc(S.config.paymentInstructions)}</div><button onclick="showLogin()">Ke Login</button></div>`}catch(x){toast(x.message)}}async function setup(e){e.preventDefault();try{await api('/setup-owner',{method:'POST',body:JSON.stringify({setupKey:$('#setupKey').value,name:$('#name').value,email:$('#email').value,password:$('#password').value})});toast('Owner berhasil dibuat. Silakan login.');showLogin()}catch(x){toast(x.message)}}async function logout(){await api('/logout',{method:'POST'});S.user=null;render()}
async function ownerDash(){let [u,t]=await Promise.all([api('/owner/users'),api('/trees')]);S.trees=t.trees;$('#app').innerHTML=`<div class="tabs"><button class="active">Member</button><button class="ghost" onclick="ownerTrees()">Semua Silsilah</button></div><div class="card"><div class="row"><div><h2>Manajemen Member</h2><p class="muted">Owner Web hanya mengelola akun dan pembayaran.</p></div><span class="pill">${u.users.length} akun</span></div><div>${u.users.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.email)} · ${esc(x.plan)} · Rp ${Number(x.amount||0).toLocaleString('id-ID')}</div></div><div><span class="pill ${x.status}">${x.status}</span> ${x.status==='active'?`<button class="danger" onclick="suspend(${x.id})">Tangguhkan</button>`:`<button onclick="activate(${x.id})">Aktifkan</button>`}</div></div>`).join('')||'<p class="muted">Belum ada Member.</p>'}</div></div>`}
async function ownerTrees(){let r=await api('/trees');S.trees=r.trees;$('#app').innerHTML=`<div class="tabs"><button onclick="ownerDash()">Member</button><button class="active">Semua Silsilah</button></div><div class="grid" style="grid-template-columns:1fr">${S.trees.map(t=>`<div class="card row"><div><h3>${esc(t.name)}</h3><p class="muted">Pemilik: ${esc(t.creator_name)}</p></div><button onclick="openTree(${t.id},true)">Lihat</button></div>`).join('')||'<div class="card">Belum ada silsilah.</div>'}</div>`}
async function activate(id){try{await api('/owner/users/activate',{method:'POST',body:JSON.stringify({userId:id})});ownerDash()}catch(e){toast(e.message)}}async function suspend(id){try{await api('/owner/users/suspend',{method:'POST',body:JSON.stringify({userId:id})});ownerDash()}catch(e){toast(e.message)}}
async function memberDash(){let r=await api('/trees');S.trees=r.trees;$('#app').innerHTML=`<div class="row"><div><h2>Dashboard</h2><p class="muted">Paket: <b>${esc(S.user.plan||'premium')}</b>. Owner akun memiliki kendali penuh atas silsilahnya.</p></div><button onclick="newTree()">+ Silsilah Baru</button></div><div class="grid" style="margin-top:18px">${S.trees.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.description||'')}</p><button onclick="openTree(${t.id},false)">Kelola Silsilah</button></div>`).join('')||'<div class="card"><p>Belum ada silsilah. Buat silsilah pertama.</p></div>'}</div><div class="card" style="margin-top:18px"><h3>Undangan Family Member</h3><div id="myInvites">Memuat...</div></div><div class="card" style="margin-top:18px"><h3>Silsilah yang Saya Ikuti</h3><div id="myMemberships">Memuat...</div></div>`;loadInvites();loadMemberships()}
async function loadInvites(){try{let r=await api('/my/invitations');$('#myInvites').innerHTML=r.invites.map(i=>`<div class="item row"><span>${esc(i.tree_name)} — ${esc(i.first_name+' '+i.last_name)}</span><button onclick="acceptInvite('${i.token}')">Terima</button></div>`).join('')||'<span class="muted">Tidak ada undangan.</span>'}catch(e){$('#myInvites').textContent=e.message}}async function acceptInvite(t){try{await api('/invitations/'+t,{method:'POST'});toast('Undangan diterima');memberDash()}catch(e){toast(e.message)}}async function loadMemberships(){try{let r=await api('/my/memberships');$('#myMemberships').innerHTML=r.memberships.map(x=>`<div class="item">${esc(x.tree_name)} · Anda terhubung sebagai <b>${esc(x.first_name+' '+x.last_name)}</b></div>`).join('')||'<span class="muted">Belum ada.</span>'}catch(e){$('#myMemberships').textContent=e.message}}
async function newTree(){let n=prompt('Nama silsilah keluarga');if(!n)return;let d=prompt('Deskripsi singkat')||'';try{await api('/trees',{method:'POST',body:JSON.stringify({name:n,description:d})});memberDash()}catch(e){toast(e.message)}}
function personNode(p,editable){let a=age(p.birth_date,p.death_date),status=p.death_date?`Wafat · ${a??'-'} th`:(a==null?'':a+' th');return `<div class="node"><b>${esc(full(p))}</b><span>${p.gender==='male'?'♂':p.gender==='female'?'♀':'•'} ${esc(status)}</span>${p.birth_place?`<span>${esc(p.birth_place)}</span>`:''}${editable?`<button style="margin-top:8px;padding:7px 10px" onclick="editPerson(${p.id})">Edit</button>`:''}</div>`}
function buildTree(persons,rels,editable){let pa=new Map(),ch=new Map(),sp=new Map();for(let r of rels){if(r.type==='parent'){if(!pa.has(r.to_person_id))pa.set(r.to_person_id,[]);pa.get(r.to_person_id).push(r.from_person_id);if(!ch.has(r.from_person_id))ch.set(r.from_person_id,[]);ch.get(r.from_person_id).push(r.to_person_id)}else{if(!sp.has(r.from_person_id))sp.set(r.from_person_id,[]);sp.get(r.from_person_id).push(r.to_person_id);if(!sp.has(r.to_person_id))sp.set(r.to_person_id,[]);sp.get(r.to_person_id).push(r.from_person_id)}}let roots=persons.filter(p=>!(pa.get(p.id)||[]).length),used=new Set(),levels=[],cur=roots.slice(0,12);for(let depth=0;depth<7&&cur.length;depth++){levels.push(cur);cur=[...new Set(cur.flatMap(x=>ch.get(x.id)||[]))].map(id=>persons.find(p=>p.id===id)).filter(Boolean).slice(0,30)}let html='';for(let lv of levels){html+=`<div class="tree-level">${lv.map(p=>{used.add(p.id);let partner=(sp.get(p.id)||[]).map(id=>persons.find(x=>x.id===id)).find(x=>x&&!used.has(x.id));return `<div class="couple">${personNode(p,editable)}${partner?personNode(partner,editable):''}</div>`}).join('')}</div><div class="line"></div>`}let extra=persons.filter(p=>!used.has(p.id));if(extra.length)html+=`<div class="notice">Anggota lain:</div><div class="tree-level">${extra.map(p=>personNode(p,editable)).join('')}</div>`;return `<div class="tree-canvas">${html||'<div class="muted">Belum cukup data untuk membentuk pohon.</div>'}</div>`}
async function openTree(id,readonly=false){S.tree=S.trees.find(x=>x.id===id)||{};S.persons=(await api('/trees/'+id+'/persons')).persons;S.rels=(await api('/trees/'+id+'/relationships')).relationships;let access=readonly||S.user.role==='owner';let share=access?{public:false}:await api('/trees/'+id+'/share');$('#app').innerHTML=`<div class="row"><div><h2>${esc(S.tree.name)}</h2><p class="muted">${esc(S.tree.description||'')}</p></div><button class="ghost" onclick="${access?'ownerTrees()':'memberDash()'}">Kembali</button></div>${access?'<div class="notice">👁 Mode Owner Web — read only. Data keluarga pelanggan tidak dapat diubah.</div>':`<div class="editor-grid" style="margin-top:18px"><div class="card"><h3>Tambah Anggota</h3><form class="form" onsubmit="addPerson(event)"><input id="first" placeholder="Nama depan" required><input id="last" placeholder="Nama belakang"><select id="gender"><option value="male">Laki-laki</option><option value="female">Perempuan</option><option value="other">Lainnya</option></select><input id="birth" type="date"><input id="death" type="date"><input id="place" placeholder="Tempat lahir"><textarea id="notes" placeholder="Catatan"></textarea><select id="anchor"><option value="">Hubungkan setelah dibuat (opsional)</option>${S.persons.map(p=>`<option value="${p.id}">${esc(full(p))}</option>`).join('')}</select><select id="rtype"><option value="parent">Orang tua → anak</option><option value="spouse">Pasangan</option></select><button>Tambah Anggota</button></form></div><div class="card"><h3>Kolaborasi & Publikasi</h3><p class="muted">Paket <b>${esc(S.user.plan||'premium')}</b>: ${S.user.plan==='ultimate'?20:10} Family Member · ${S.user.plan==='ultimate'?6:3} generasi atas/bawah.</p><button onclick="shareToggle(${share.public})">${share.public?'Nonaktifkan publik':'Jadikan publik'}</button><div class="notice">${share.public?`Link publik: <b>${esc(share.url)}</b>`:'Pohon masih privat.'}</div><button class="ghost" onclick="showClaims()">Permintaan Klaim</button><button class="ghost" onclick="showInvites()">Undang Family Member</button></div></div>`}<div class="card" style="margin-top:18px"><h3>🌳 Pohon Silsilah</h3><div class="tree-wrap">${buildTree(S.persons,S.rels,!access)}</div></div><div class="card" style="margin-top:18px"><h3>Daftar Anggota</h3>${S.persons.map(p=>`<div class="item row"><div><b>${esc(full(p))}</b><div class="small muted">${p.birth_date?esc(p.birth_date):'Tanggal lahir tidak diisi'} ${p.death_date?' · Wafat '+esc(p.death_date):''}</div></div>${access?'':`<div><button onclick="editPerson(${p.id})">Edit</button><button class="danger" onclick="delPerson(${p.id})">Hapus</button></div>`}</div>`).join('')||'<p class="muted">Belum ada anggota.</p>'}</div>`}
async function addPerson(e){e.preventDefault();try{let anchor=$('#anchor').value;await api('/trees/'+S.tree.id+'/persons',{method:'POST',body:JSON.stringify({first_name:$('#first').value,last_name:$('#last').value,gender:$('#gender').value,birth_date:$('#birth').value,death_date:$('#death').value,birth_place:$('#place').value,notes:$('#notes').value,anchor_person_id:anchor,relation_type:anchor?$('#rtype').value:''})});openTree(S.tree.id,false)}catch(x){toast(x.message)}}
async function editPerson(id){let p=S.persons.find(x=>x.id===id);if(!p)return;let n=prompt('Nama lengkap',full(p));if(n===null)return;let bd=prompt('Tanggal lahir (YYYY-MM-DD)',p.birth_date||'');if(bd===null)return;let dd=prompt('Tanggal meninggal (kosong jika masih hidup)',p.death_date||'');if(dd===null)return;try{let parts=n.trim().split(/\s+/),first=parts.shift()||'';await api('/persons/'+id,{method:'PATCH',body:JSON.stringify({first_name:first,last_name:parts.join(' '),gender:p.gender,birth_date:bd,death_date:dd,birth_place:p.birth_place,notes:p.notes,photo_url:p.photo_url})});openTree(S.tree.id,S.user.role==='owner')}catch(e){toast(e.message)}}async function delPerson(id){if(!confirm('Hapus anggota dan relasinya?'))return;try{await api('/persons/'+id,{method:'DELETE'});openTree(S.tree.id,false)}catch(e){toast(e.message)}}
async function shareToggle(current){try{let d=await api('/trees/'+S.tree.id+'/share',{method:'POST',body:JSON.stringify({is_public:!current})});toast(d.public?'Silsilah sekarang publik':'Silsilah kembali privat');openTree(S.tree.id,false)}catch(e){toast(e.message)}}async function showClaims(){let r=await api('/trees/'+S.tree.id+'/claims');$('#app').insertAdjacentHTML('afterbegin',`<div class="card" id="claimPanel"><div class="row"><h3>Permintaan Klaim</h3><button class="ghost" onclick="$('#claimPanel').remove()">Tutup</button></div>${r.claims.map(c=>`<div class="item row"><span>${esc(c.requester_name)} ingin mengklaim <b>${esc(c.first_name+' '+c.last_name)}</b></span><span><button onclick="claimAction(${c.id},'approve')">Terima</button><button class="danger" onclick="claimAction(${c.id},'reject')">Tolak</button></span></div>`).join('')||'<p class="muted">Tidak ada permintaan.</p>'}</div>`)}async function claimAction(id,a){try{await api('/trees/'+S.tree.id+'/claims',{method:'POST',body:JSON.stringify({claimId:id,action:a})});showClaims()}catch(e){toast(e.message)}}async function showInvites(){let pid=prompt('Masukkan ID anggota yang ingin diundang.');if(!pid)return;let e=prompt('Email calon Family Member');if(!e)return;try{let d=await api('/trees/'+S.tree.id+'/invites',{method:'POST',body:JSON.stringify({personId:Number(pid),email:e})});alert('Link undangan:\n'+d.inviteUrl);openTree(S.tree.id,false)}catch(x){toast(x.message)}}
async function publicTree(tok){$('#navActions').innerHTML='';try{let d=await api('/public/trees/'+encodeURIComponent(tok));$('#app').innerHTML=`<div class="public-card"><div class="public-head"><div class="eyebrow">SILSILAH PUBLIK</div><h1>${esc(d.tree.name)}</h1><p class="muted">${esc(d.tree.description||'')}</p></div><div class="card"><div class="tree-wrap">${buildPublic(d.persons,d.relationships)}</div></div><div class="notice">Profil publik mengikuti pengaturan privasi Owner. Data sensitif tidak ditampilkan secara default.</div></div>`}catch(e){$('#app').innerHTML=`<div class="card"><h2>Silsilah tidak tersedia</h2><p>${esc(e.message)}</p></div>`}}
function buildPublic(ps,rs){let pa=new Map(),ch=new Map();for(let r of rs)if(r.type==='parent'){if(!pa.has(r.to_person_id))pa.set(r.to_person_id,[]);pa.get(r.to_person_id).push(r.from_person_id);if(!ch.has(r.from_person_id))ch.set(r.from_person_id,[]);ch.get(r.from_person_id).push(r.to_person_id)}let roots=ps.filter(p=>!(pa.get(p.id)||[]).length),cur=roots,html='';for(let i=0;i<7&&cur.length;i++){html+=`<div class="tree-level">${cur.map(p=>`<div class="node public-person"><b>${esc(p.name)}</b><span>${p.isDeceased?'Wafat':p.age!=null?p.age+' tahun':''}</span>${p.birth_date?`<span>${esc(p.birth_date)}</span>`:''}${p.birth_place?`<span>${esc(p.birth_place)}</span>`:''}</div>`).join('')}</div><div class="line"></div>`;cur=[...new Set(cur.flatMap(p=>ch.get(p.id)||[]))].map(id=>ps.find(p=>p.id===id)).filter(Boolean)}return html||'<p class="muted">Belum ada jalur keluarga untuk ditampilkan.</p>'}
boot();
</script></body></html>
