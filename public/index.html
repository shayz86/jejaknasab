box-shadow:0 0 0 1px #3f8cff33}.price{font-size:27px;font-weight:900;margin:15px 0 8px;color:#66a5ff}.card{padding:24px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid #29445f;border-radius:12px;background:#081a2e;color:#f5f8fc;outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:#4c96ff;box-shadow:0 0 0 3px #3f8cff22}.setup-card{max-width:660px;margin:58px auto 0}.setup-card h1{font-size:clamp(34px,7vw,52px);line-height:1.05;margin:20px 0 24px}.setup-note{font-size:17px;line-height:1.7;color:#aebed2}.setup-back{display:inline-block;margin-top:18px;color:#a9c8f6;text-decoration:none}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:99px;background:#1c3148;font-size:12px;font-weight:800}.active{background:#123d2c;color:#8be0b5}.pending{background:#4a3b12;color:#f7d77a}.suspended{background:#451b24;color:#ffadb9}.item{padding:14px;border:1px solid var(--border);border-radius:12px;background:#0c2036;margin-bottom:10px}.muted{color:var(--muted)}.small{font-size:12px}.tree-wrap{overflow:auto;background:#081a2e;border:1px dashed #35516d;border-radius:16px;padding:22px;min-height:360px}.tree-canvas{min-width:760px;padding:25px}.tree-level{display:flex;justify-content:center;gap:18px;position:relative;margin:16px 0}.node{width:180px;padding:14px;border:1px solid #315575;background:#112b48;border-radius:15px;text-align:center;box-shadow:0 8px 18px #0003}.node b{display:block;font-size:15px}.node span{display:block;color:#9fb0c7;font-size:12px;margin-top:5px}.tree-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:8px}.tree-action{padding:6px 8px;font-size:11px;border-radius:9px}.couple{display:flex;align-items:center;gap:8px}.couple:after{content:'';display:block;width:28px;height:2px;background:#5b82aa}.line{height:18px;border-left:2px solid #35516d;margin:auto}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.privacy{display:grid;gap:8px;margin-top:12px}.privacy label{display:flex;gap:8px;align-items:center;color:#dce7f5}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal .card{width:min(680px,100%);max-height:90vh;overflow:auto}.check-grid{display:grid;gap:10px}.check-grid label{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--border);border-radius:11px;background:#0c2036}.linkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.linkrow input{flex:1;min-width:220px}.actions{display:flex;gap:8px;flex-wrap:wrap}.privacy label{display:flex;gap:8px;align-items:center;color:#dce7f5}.notice{padding:13px 15px;border-radius:12px;background:#0c2036;border:1px solid var(--border);margin:12px 0}.notice.ok{background:var(--ok);color:#b6f0d0}.public-card{max-width:1100px;margin:auto}.public-head{text-align:center;margin-bottom:22px}.public-tree{display:grid;gap:18px}.public-person{cursor:pointer;transition:.18s transform,.18s border-color}.public-person:hover{transform:translateY(-2px);border-color:#5b9fff}.rel-line{position:relative;height:28px;display:flex;justify-content:center;align-items:center}.rel-line:before{content:"";width:2px;height:100%;background:#35516d}.couple-link{display:flex;align-items:center;gap:0}.couple-link:before{content:"";width:28px;height:2px;background:#5b82aa}.child-connector{height:26px;border-left:2px solid #35516d;margin:auto}.tree-group{display:flex;flex-direction:column;align-items:center;gap:0}.tree-children{display:flex;justify-content:center;gap:18px;position:relative;margin-top:18px}.tree-children:before{content:"";position:absolute;top:-10px;left:8%;right:8%;height:2px;background:#35516d}.tree-children .node-wrap{position:relative}.tree-children .node-wrap:before{content:"";position:absolute;top:-10px;left:50%;width:2px;height:10px;background:#35516d}.public-info{display:grid;gap:10px}.public-info .photo{width:100px;height:100px;border-radius:16px;object-fit:cover}.price-old{text-decoration:line-through;color:#71839a;margin-right:8px}.upgrade-card{border-color:#5b9fff}.radio-grid{display:grid;gap:10px}.radio-grid label{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:11px;background:#0c2036}.hint{font-size:13px;color:var(--muted);line-height:1.5}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:12px;background:#101c2b;color:#fff;border:1px solid #34506c;display:none;z-index:9;max-width:min(92vw,520px)}.toast.error{background:#3a1720;border-color:#71303c;color:#ffc0c8}@media(max-width:760px){.wrap{padding:15px}.feature-grid,.package-grid,.grid,.editor-grid{grid-template-columns:1fr}.hero{padding-top:22px}.hero h1{font-size:clamp(42px,13vw,58px)}.card{padding:20px}.setup-card{margin-top:34px}.nav{margin-bottom:10px}}

.tree-viewport{position:relative;overflow:auto;background:#081a2e;border-radius:14px;min-height:380px;max-height:75vh;touch-action:pan-x pan-y}.tree-viewport .tree-canvas{display:inline-flex;flex-direction:column;align-items:center;min-width:max-content;min-height:100%;padding:34px}.tree-toolbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:10px}.tree-zoom{min-width:44px;padding:9px 12px}.tree-family{display:flex;flex-direction:column;align-items:center;gap:0;position:relative}.tree-couple{display:flex;align-items:center;justify-content:center;gap:0}.tree-couple>.node-wrap+.node-wrap:before{content:'';display:block;width:36px;height:2px;background:#5b82aa;position:absolute;left:-36px;top:50%}.node-wrap{position:relative}.family-children{display:flex;justify-content:center;gap:22px;position:relative;margin-top:34px;padding-top:18px}.family-children:before{content:'';position:absolute;top:0;left:5%;right:5%;height:2px;background:#35516d}.family-children>.tree-family:before{content:'';position:absolute;top:-18px;left:50%;width:2px;height:18px;background:#35516d}.public-node{cursor:pointer}.public-node:hover{transform:translateY(-2px);border-color:#5b9fff}.public-stage{display:inline-block;transform-origin:top left}.order-list{display:grid;gap:8px}.order-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#0c2036}.order-row .actions{margin-left:auto}.no-border-tree{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;min-height:0!important}
.tree-workspace{position:relative;overflow:auto;background:#081a2e;border-radius:14px;min-height:420px;max-height:75vh;touch-action:pan-x pan-y;overscroll-behavior:contain}.tree-stage{display:inline-block;width:max-content;min-width:100%;transform-origin:top left;padding:28px}.tree-stage>.tree-canvas{width:max-content;min-width:100%;padding:0}.link-button{display:inline-flex;align-items:center;text-decoration:none;cursor:pointer;border:1px solid transparent;border-radius:12px;padding:12px 16px;background:var(--primary);color:#fff;font-weight:800}.link-button.ghost{color:#dbe7f5;background:#0d2036;border-color:#29445f}.copy-target{user-select:all;-webkit-user-select:all}.bulk-box{padding:14px;border:1px solid var(--border);border-radius:12px;background:#0c2036;margin-bottom:12px}.bulk-box b{display:block;margin-bottom:5px}</style></head><body><div class="wrap"><div class="nav"><div class="brand">JejakNasab</div><div id="navActions"></div></div><main id="app"></main></div><div id="toast" class="toast"></div><div id="modal"></div><script>
const $=s=>document.querySelector(s),api=async(path,opt={})=>{const r=await fetch('/api'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d};let S={user:null,config:null,trees:[],tree:null,persons:[],rels:[]};
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;',"\"":'&quot;'}[c]))}function toast(x){let t=$('#toast');t.textContent=x;t.classList.toggle('error',/gagal|salah|belum|tidak|error/i.test(x));t.style.display='block';setTimeout(()=>t.style.display='none',4200)}function askConfirm(title,message){return new Promise(resolve=>{$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)window.__confirmResolve(false)"><div class="card"><h2>${esc(title)}</h2><p class="muted">${esc(message)}</p><div class="actions"><button onclick="window.__confirmResolve(true)">Ya</button><button class="ghost" onclick="window.__confirmResolve(false)">Tidak</button></div></div></div>`;window.__confirmResolve=v=>{delete window.__confirmResolve;closeModal();resolve(v)}})}function full(p){return [p.first_name,p.last_name].filter(Boolean).join(' ')}function age(b,d=''){if(!b)return null;let a=new Date(b+'T00:00:00'),z=d?new Date(d+'T00:00:00'):new Date();if(isNaN(a)||isNaN(z))return null;let n=z.getFullYear()-a.getFullYear();if(z.getMonth()<a.getMonth()||(z.getMonth()===a.getMonth()&&z.getDate()<a.getDate()))n--;return n}
async function boot(){let path=location.pathname.replace(/\/$/,'');if(path==='/setup-owner')return ownerSetup();if(path.startsWith('/f/'))return publicTree(path.slice(3));if(path.startsWith('/invite/'))return invitePage(path.slice(7));try{S.config=await api('/config')}catch(e){S.config={premium:{price:50000,familyMembers:10,generation:3},ultimate:{price:100000,familyMembers:20,generation:6},paymentInstructions:'Hubungi owner untuk instruksi pembayaran.'};toast('Konfigurasi server belum terbaca. Tampilan tetap dimuat.')}try{S.user=(await api('/me')).user}catch(e){S.user=null;toast('Sesi belum dapat dibaca. Silakan login kembali jika diperlukan.')}render()}function nav(){let n=$('#navActions');if(!S.user){n.innerHTML='<button class="ghost" onclick="showLogin()">Masuk</button> <button onclick="showRegister()">Daftar</button>'}else n.innerHTML=`<span class="muted">${esc(S.user.name)} · ${S.user.role==='owner'?'Owner Web':'Member'}</span> <button class="ghost" onclick="logout()">Keluar</button>`}
async function render(){nav();if(!S.user)return home();try{if(S.user.role==='owner')await ownerDash();else await memberDash()}catch(e){$('#app').innerHTML=`<div class="card"><h2>Gagal memuat dashboard</h2><p class="muted">${esc(e.message||'Terjadi kesalahan pada server.')}</p><button onclick="location.reload()">Coba lagi</button></div>`;toast(e.message||'Terjadi kesalahan')}}function home(){$('#app').innerHTML=`<section class="hero"><div class="hero-inner"><div class="eyebrow">SILSILAH KELUARGA DIGITAL</div><h1>Menjaga Jejak,<br>Menghubungkan Generasi.</h1><p>Bangun, simpan, dan wariskan silsilah keluarga Anda dalam satu tempat yang mudah digunakan dan dapat dikelola bersama keluarga.</p><div class="hero-actions"><button onclick="showRegister()">Mulai Membuat Silsilah</button><button class="ghost" onclick="showLogin()">Masuk</button></div></div></section><section class="feature-grid"><div class="feature-card"><h3>🌳 Pohon keluarga</h3><p>Hubungkan leluhur, pasangan, anak, saudara, dan cabang keluarga.</p></div><div class="feature-card"><h3>👨‍👩‍👧 Kolaborasi keluarga</h3><p>Owner dapat mengundang dan menerima Family Member dengan hak akses terkontrol.</p></div><div class="feature-card"><h3>🔐 Akses terkontrol</h3><p>Family Member hanya dapat mengelola wilayah silsilah sesuai paket.</p></div></section><section class="packages"><div class="section-kicker">Pilihan paket</div><h2 class="section-title">Pilih sesuai kebutuhan keluarga</h2><div class="package-grid"><div class="package-card"><h3>Premium</h3><p>Untuk keluarga yang ingin mulai membangun silsilah digital.</p><div class="price">Rp ${Number(S.config?.premium?.price||50000).toLocaleString('id-ID')}</div><div class="muted">10 Family Member · 3 generasi atas & 3 bawah</div></div><div class="package-card featured"><h3>Ultimate</h3><p>Untuk keluarga besar dengan kebutuhan pengelolaan yang lebih luas.</p><div class="price">Rp ${Number(S.config?.ultimate?.price||100000).toLocaleString('id-ID')}</div><div class="muted">20 Family Member · 6 generasi atas & 6 bawah</div></div></div></section>`}
function showLogin(){nav();$('#app').innerHTML=`<div class="card" style="max-width:520px;margin:auto"><h2>Masuk</h2><form class="form" onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button></form><button class="ghost" style="margin-top:10px" onclick="home()">Kembali</button></div>`}function showRegister(inviteToken=''){if(inviteToken)S.inviteToken=inviteToken;$('#modal').innerHTML=`<div class="modal"><div class="card"><h2>Daftar Family Member</h2><form class="form" onsubmit="register(event)"><input id="rname" placeholder="Nama lengkap" required><input id="remail" type="email" placeholder="Email" required><input id="rpass" type="password" placeholder="Password minimal 8 karakter" required><select id="rplan"><option value="premium">Premium</option><option value="ultimate">Ultimate</option></select>${S.inviteToken?'<div class="notice">Anda mendaftar melalui undangan Family Member. Setelah akun aktif, permintaan bergabung akan menunggu persetujuan Owner Akun.</div>':''}<button>Daftar</button><button type="button" class="ghost" onclick="closeModal()">Batal</button></form></div></div>`}
function ownerSetup(){$('#navActions').innerHTML='';$('#app').innerHTML=`<div class="card setup-card"><div class="setup-kicker">AKSES KHUSUS OWNER</div><h1>Setup Owner Pertama</h1><p class="setup-note">Halaman ini hanya dapat dibuka melalui URL khusus dan tidak ditampilkan di halaman utama.</p><form class="form" onsubmit="setup(event)"><input id="setupKey" placeholder="OWNER_SETUP_KEY" required><input id="name" placeholder="Nama owner" required><input id="email" type="email" placeholder="Email owner" required><input id="password" type="password" minlength="8" placeholder="Password minimal 8 karakter" required><button>Buat Owner</button></form><a class="setup-back" href="/">← Kembali ke halaman utama</a></div>`}
async function login(e){e.preventDefault();try{let d=await api('/login',{method:'POST',body:JSON.stringify({email:$('#lemail').value,password:$('#lpass').value})});S.user=d.user;let tok=localStorage.getItem('jn_pending_invite')||'';if(tok){try{await api('/invitations/'+encodeURIComponent(tok),{method:'POST'});localStorage.removeItem('jn_pending_invite');toast('Permintaan bergabung dikirim. Tunggu persetujuan Owner Akun.')}catch(inv){toast(inv.message)}}closeModal();nav();render()}catch(x){toast(x.message)}}async function register(e){e.preventDefault();try{const inviteToken=S.inviteToken||'';let d=await api('/register',{method:'POST',body:JSON.stringify({name:$('#rname').value,email:$('#remail').value,password:$('#rpass').value,plan:$('#rplan').value,inviteToken})});if(inviteToken)localStorage.setItem('jn_pending_invite',inviteToken);closeModal();toast(d.message)}catch(x){toast(x.message)}}async function setup(e){e.preventDefault();try{await api('/setup-owner',{method:'POST',body:JSON.stringify({setupKey:$('#setupKey').value,name:$('#name').value,email:$('#email').value,password:$('#password').value})});toast('Owner berhasil dibuat. Silakan login.');showLogin()}catch(x){toast(x.message)}}async function logout(){try{await api('/logout',{method:'POST'})}catch{}S.user=null;render()}
async function ownerDash(){let [u,t]=await Promise.all([api('/owner/users'),api('/trees')]);S.trees=t.trees;$('#app').innerHTML=`<div class="tabs"><button class="active">Member</button><button class="ghost" onclick="ownerTrees()">Semua Silsilah</button></div><div class="card"><div class="row"><div><h2>Manajemen Member</h2><p class="muted">Owner Web hanya mengelola akun dan pembayaran.</p></div><span class="pill">${u.users.length} akun</span></div><div>${u.users.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.email)} · ${esc(x.plan)} · Rp ${Number(x.amount||0).toLocaleString('id-ID')}</div>${x.payment_status==='pending'?`<div class="small"><b>Menunggu verifikasi:</b> ${esc(x.payment_note||'Pembayaran')}</div>`:''}</div><div><span class="pill ${x.status}">${x.status}</span> ${x.payment_status==='pending'?`<button onclick="activate(${x.id})">Verifikasi</button>`:x.status==='active'?`<button class="danger" onclick="suspend(${x.id})">Tangguhkan</button>`:`<button onclick="activate(${x.id})">Aktifkan</button>`}</div></div>`).join('')||'<p class="muted">Belum ada Member.</p>'}</div></div>`}async function ownerTrees(){let r=await api('/trees');S.trees=r.trees;$('#app').innerHTML=`<div class="tabs"><button onclick="ownerDash()">Member</button><button class="active">Semua Silsilah</button></div><div class="grid" style="grid-template-columns:1fr">${S.trees.map(t=>`<div class="card row"><div><h3>${esc(t.name)}</h3><p class="muted">Pemilik: ${esc(t.creator_name)}</p></div><button onclick="openTree(${t.id},true)">Lihat (read-only)</button></div>`).join('')||'<div class="card">Belum ada silsilah.</div>'}</div>`}
async function activate(id){try{await api('/owner/users/activate',{method:'POST',body:JSON.stringify({userId:id})});ownerDash()}catch(e){toast(e.message)}}async function suspend(id){try{await api('/owner/users/suspend',{method:'POST',body:JSON.stringify({userId:id})});ownerDash()}catch(e){toast(e.message)}}
async function memberDash(){let r=await api('/trees');S.trees=r.trees;let hasOwn=S.trees.some(t=>t.created_by===S.user.id);$('#app').innerHTML=`<div class="row"><div><h2>Dashboard</h2><p class="muted">Paket: <b>${esc(S.user.plan||'premium')}</b>. Owner akun memiliki kendali penuh atas silsilahnya.</p>${S.user.plan==='premium'?`<div class="card upgrade-card" style="margin-top:14px"><h3>⭐ Upgrade ke Ultimate</h3><p class="muted">Dapatkan batas 20 Family Member dan 6 generasi atas/bawah. Upgrade Premium mendapat <b>diskon 40%</b>.</p><p><span class="price-old">Rp ${Number(S.config?.ultimate?.price||100000).toLocaleString('id-ID')}</span><b class="price">Rp ${Number(S.config?.ultimate?.upgradePrice||60000).toLocaleString('id-ID')}</b></p><button onclick="requestUpgrade()">Ajukan Upgrade</button></div>`:''}</div>${hasOwn?'':'<button onclick="newTree()">+ Silsilah Baru</button>'}</div><div class="grid" style="margin-top:18px">${S.trees.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.description||'')}</p><button onclick="openTree(${t.id},false)">Kelola Silsilah</button></div>`).join('')||'<div class="card"><p>Belum ada silsilah. Buat silsilah pertama.</p></div>'}</div><div class="card" style="margin-top:18px"><h3>Undangan Family Member</h3><div id="myInvites">Memuat...</div></div><div class="card" style="margin-top:18px"><h3>Silsilah yang Saya Ikuti</h3><div id="myMemberships">Memuat...</div></div>`;loadInvites();loadMemberships()}
async function loadInvites(){try{let r=await api('/my/invitations');$('#myInvites').innerHTML=r.invites.map(i=>`<div class="item row"><span>${esc(i.tree_name)} — ${esc(i.first_name+' '+i.last_name)}</span>${i.requested_at?'<span class="pill pending">Menunggu persetujuan Owner</span>':`<button onclick="requestInvite('${i.token}')">Ajukan bergabung</button>`}</div>`).join('')||'<span class="muted">Tidak ada undangan.</span>'}catch(e){$('#myInvites').textContent=e.message}}async function requestInvite(t){try{await api('/invitations/'+encodeURIComponent(t),{method:'POST'});toast('Permintaan bergabung dikirim. Tunggu persetujuan Owner Akun.');memberDash()}catch(e){toast(e.message)}}async function loadMemberships(){try{let r=await api('/my/memberships');$('#myMemberships').innerHTML=r.memberships.map(x=>`<div class="item">${esc(x.tree_name)} · Anda terhubung sebagai <b>${esc(x.first_name+' '+x.last_name)}</b></div>`).join('')||'<span class="muted">Belum ada.</span>'}catch(e){$('#myMemberships').textContent=e.message}}
function newTree(){S.treeSetup={};$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Silsilah Baru</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="muted">Pilih apakah nama silsilah dibuat sendiri atau otomatis mengikuti nama anggota laki-laki teratas.</p><form class="form" onsubmit="createTree(event)"><div class="radio-grid"><label><input type="radio" name="namemode" value="auto" checked> Otomatis — nama laki-laki teratas</label><label><input type="radio" name="namemode" value="manual"> Saya tentukan nama sendiri</label></div><input id="newTreeName" placeholder="Nama silsilah (jika manual)"><textarea id="newTreeDesc" placeholder="Deskripsi singkat (opsional)"></textarea><button>Buat Silsilah</button></form></div></div>`}async function createTree(e){e.preventDefault();let mode=document.querySelector('input[name=namemode]:checked')?.value||'auto';let name=$('#newTreeName').value.trim();if(mode==='manual'&&!name){toast('Isi nama silsilah atau pilih otomatis.');return}try{await api('/trees',{method:'POST',body:JSON.stringify({name,autoName:mode==='auto',description:$('#newTreeDesc').value})});closeModal();memberDash()}catch(x){toast(x.message)}}async function requestUpgrade(){try{let d=await api('/account/upgrade',{method:'POST'});toast(d.message)}catch(e){toast(e.message)}}
function personNode(p,editable){let a=age(p.birth_date,p.death_date),status=p.death_date?`Wafat · ${a??'-'} th`:(a==null?'':a+' th');let actions='';if(editable){actions+=`<button class="tree-action" onclick="event.stopPropagation();editPerson(${p.id})">Edit</button>`;if(S.user?.role==='member'&&S.tree?.created_by===S.user.id)actions+=`<button class="tree-action ghost" onclick="event.stopPropagation();privacyPerson(${p.id})">Info Publik</button><button class="tree-action danger" onclick="event.stopPropagation();delPerson(${p.id})">Hapus</button>`}return `<div class="node"><b>${esc(full(p))}</b><span>${p.gender==='male'?'♂':p.gender==='female'?'♀':'•'} ${esc(status)}</span>${p.birth_place?`<span>${esc(p.birth_place)}</span>`:''}${actions?`<div class="tree-actions">${actions}</div>`:''}</div>`}
function graphRows(persons,rels){const byId=new Map(persons.map(p=>[p.id,p])),parents=new Map(),children=new Map(),spouses=new Map();const add=(m,k,v)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(v)};for(const r of rels){if(r.type==='parent'){add(parents,r.to_person_id,r.from_person_id);add(children,r.from_person_id,r.to_person_id)}else if(r.type==='spouse'){add(spouses,r.from_person_id,r.to_person_id);add(spouses,r.to_person_id,r.from_person_id)}}const rank=p=>p?.gender==='male'?0:p?.gender==='female'?1:2;for(const [k,v] of children)v.sort((a,b)=>{const oa=Number(byId.get(a)?.sibling_order||0),ob=Number(byId.get(b)?.sibling_order||0);if(oa&&ob&&oa!==ob)return oa-ob;if(oa&&!ob)return -1;if(ob&&!oa)return 1;return rank(byId.get(a))-rank(byId.get(b))||a-b});for(const [k,v] of spouses)v.sort((a,b)=>rank(byId.get(a))-rank(byId.get(b))||a-b);const roots=persons.filter(p=>!(parents.get(p.id)||[]).length).sort((a,b)=>rank(a)-rank(b)||String(full(a)).localeCompare(String(full(b))));return{byId,parents,children,spouses,roots:roots.length?roots:persons.slice(0,1)}}
function buildTree(persons,rels,editable){const g=graphRows(persons,rels),used=new Set();const canEdit=p=>editable&&p.can_edit!==false;function family(id){if(used.has(id))return '';const p=g.byId.get(id);if(!p)return '';used.add(id);let partner=(g.spouses.get(id)||[]).map(x=>g.byId.get(x)).find(x=>x&&!used.has(x.id));if(partner)used.add(partner.id);const people=[p,partner].filter(Boolean),childIds=[];for(const x of people)for(const cid of g.children.get(x.id)||[])if(!used.has(cid))childIds.push(cid);const unique=[...new Set(childIds)];return `<div class="tree-family"><div class="tree-couple">${people.map(x=>`<div class="node-wrap">${personNode(x,canEdit(x))}</div>`).join('')}</div>${unique.length?`<div class="family-children">${unique.map(cid=>family(cid)).join('')}</div>`:''}</div>`}let html=g.roots.map(r=>family(r.id)).join('');const extra=persons.filter(p=>!used.has(p.id));if(extra.length)html+=`<div class="notice"><b>Anggota lain</b><div class="tree-level">${extra.map(p=>personNode(p,canEdit(p))).join('')}</div></div>`;return `<div class="tree-canvas">${html||'<div class="muted">Belum cukup data untuk membentuk pohon.</div>'}</div>`}
async function openTree(id,readonly=false){S.tree=S.trees.find(x=>x.id===id)||{};S.persons=(await api('/trees/'+id+'/persons')).persons;S.rels=(await api('/trees/'+id+'/relationships')).relationships;let access=readonly||S.user.role==='owner',owner=!readonly&&S.user.role==='member'&&S.tree.created_by===S.user.id;let share=await api('/trees/'+id+'/share').catch(()=>({public:false,token:null,url:null}));let publicBtn=share.public?`<a class="ghost link-button" href="${esc(share.url||'#')}">Buka Link Publik ↗</a>`:'';let orderedPersons=privacySortedPersons();let parentOpts=orderedPersons.filter(p=>p.can_edit!==false).map(p=>`<option value="${p.id}">${esc(full(p))}</option>`).join('');let memberRows=sortedMemberRows();$('#app').innerHTML=`<div class="row"><div><h2>${esc(S.tree.name)}</h2><p class="muted">${esc(S.tree.description||'')}</p></div><div class="actions">${owner?'<button class="ghost" onclick="editTreeMeta()">Edit Silsilah</button>':''}<button class="ghost" onclick="${access?'ownerTrees()':'memberDash()'}">Kembali</button></div></div>${access?'<div class="notice">👁 Mode Owner Web — read only. Data keluarga pelanggan tidak dapat diubah.</div>':`<div class="editor-grid" style="margin-top:18px"><div class="card"><h3>Tambah Anggota</h3><form class="form" onsubmit="addPerson(event)"><input id="first" placeholder="Nama depan" required><input id="last" placeholder="Nama belakang"><select id="gender"><option value="male">Laki-laki</option><option value="female">Perempuan</option><option value="other">Lainnya</option></select><label class="small muted">Tanggal lahir (opsional)</label><input id="birth" type="date"><label class="small muted">Tanggal meninggal (opsional — bukan wajib)</label><input id="death" type="date"><input id="place" placeholder="Tempat lahir"><textarea id="notes" placeholder="Catatan"></textarea><input id="photo" placeholder="URL foto (opsional)"><label class="small muted">Hubungkan ke anggota yang sudah ada (opsional)</label><select id="anchor" onchange="if(!this.value){$('#parentDirectionWrap').style.display='none'}else if($('#rtype').value==='parent'){$('#parentDirectionWrap').style.display='block'}"><option value="">Tidak dihubungkan</option>${parentOpts}</select><label class="small muted">Jenis hubungan</label><select id="rtype" onchange="$('#parentDirectionWrap').style.display=this.value==='parent'?'block':'none'"><option value="parent">Hubungan orang tua / anak</option><option value="spouse">Pasangan</option></select><div id="parentDirectionWrap"><label class="small muted">Posisi anggota baru</label><select id="parentDirection"><option value="parent_to_child">Anggota baru menjadi ANAK dari anggota terpilih</option><option value="child_to_parent">Anggota baru menjadi ORANG TUA dari anggota terpilih</option></select></div><button>Tambah Anggota</button></form></div><div class="card"><h3>Kolaborasi & Publikasi</h3><p class="muted">Paket <b>${esc(S.user.plan||'premium')}</b>: ${S.user.plan==='ultimate'?20:10} Family Member · ${S.user.plan==='ultimate'?6:3} generasi atas/bawah.</p><div class="actions">${publicBtn}${owner?`<button onclick="shareToggle(${share.public})">${share.public?'Nonaktifkan publik':'Jadikan publik'}</button>`:''}<button class="ghost" onclick="showChildOrder()">Atur Urutan Anak</button></div><div class="notice">${share.public?`<div>Link publik:</div><div class="linkrow"><input id="publicLinkInput" readonly value="${esc(share.url||'')}"><button class="ghost" onclick="copyPublicLink(${JSON.stringify(share.url||'')})">Salin</button></div>`:'Pohon masih privat.'}</div><div class="actions">${owner?'<button class="ghost" onclick="showPublicSettings()">Pengaturan Info Publik</button><button class="ghost" onclick="showClaims()">Permintaan Klaim</button><button class="ghost" onclick="showInvites()">Undang Family Member</button>':''}</div></div></div>`}<div class="card" style="margin-top:18px"><div class="row"><h3>🌳 Pohon Silsilah</h3><div class="tree-toolbar"><button class="ghost tree-zoom" onclick="treeZoom(-0.1)">−</button><button class="ghost tree-zoom" onclick="treeZoom(0.1)">+</button><button class="ghost" onclick="treeZoomReset()">Reset</button></div></div><div class="tree-workspace" id="treeWorkspace"><div class="tree-stage" id="treeStage">${buildTree(S.persons,S.rels,!access)}</div></div></div>`;treeZoomReset()}
function sortedMemberRows(){const g=graphRows(S.persons,S.rels),depth=new Map(),q=g.roots.map(x=>[x.id,0]);while(q.length){const [id,d]=q.shift();if(depth.has(id)&&depth.get(id)<=d)continue;depth.set(id,d);for(const c of g.children.get(id)||[])q.push([c,d+1]);for(const sp of g.spouses.get(id)||[])q.push([sp,d])}const rank=p=>p.gender==='male'?0:p.gender==='female'?1:2;return [...S.persons].sort((a,b)=>(depth.get(a.id)||0)-(depth.get(b.id)||0)||rank(a)-rank(b)||String(full(a)).localeCompare(String(full(b)))).map(p=>`<div class="item row"><div><b>${esc(full(p))}</b><div class="small muted">${p.birth_date?esc(p.birth_date):'Tanggal lahir tidak diisi'} ${p.death_date?' · Wafat '+esc(p.death_date):''}</div></div><div class="actions">${p.can_edit!==false?`<button onclick="editPerson(${p.id})">Edit</button>`:''}${S.user.role==='member'&&S.tree.created_by===S.user.id?`<button class="ghost" onclick="privacyPerson(${p.id})">Info Publik</button><button class="danger" onclick="delPerson(${p.id})">Hapus</button>`:''}</div></div>`).join('')}
function editTreeMeta(){const auto=Number(S.tree.auto_name||0)===1;$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Edit Silsilah</h2><button class="ghost" type="button" onclick="closeModal()">Tutup</button></div><form class="form" onsubmit="saveTreeMeta(event)"><label class="small muted">Nama silsilah</label><input id="treeName" value="${esc(S.tree.name||'')}" ${auto?'disabled':''}><label class="check-grid"><span><input id="treeAuto" type="checkbox" ${auto?'checked':''} onchange="$('#treeName').disabled=this.checked"> Jadikan default — otomatis mengikuti nama laki-laki teratas</span></label><p class="hint">Jika default aktif, nama silsilah mengikuti nama laki-laki yang berada paling atas. Jika belum ada, digunakan “Silsilah Keluarga”.</p><label class="small muted">Deskripsi (opsional)</label><textarea id="treeDesc">${esc(S.tree.description||'')}</textarea><button>Simpan</button><button type="button" class="ghost" onclick="closeModal()">Batal</button></form></div></div>`}async function saveTreeMeta(e){e.preventDefault();try{const auto=$('#treeAuto').checked;const name=$('#treeName').value.trim();if(!auto&&!name){toast('Nama silsilah wajib diisi.');return}await api('/trees/'+S.tree.id,{method:'PATCH',body:JSON.stringify({name,autoName:auto,description:$('#treeDesc').value})});closeModal();toast(auto?'Default nama silsilah diaktifkan.':'Nama silsilah disimpan.');let r=await api('/trees');S.trees=r.trees;S.tree=S.trees.find(x=>x.id===S.tree.id)||S.tree;openTree(S.tree.id,false)}catch(x){toast(x.message)}}async function addPerson(e){e.preventDefault();try{let anchor=$('#anchor').value;let rt=anchor?$('#rtype').value:'';await api('/trees/'+S.tree.id+'/persons',{method:'POST',body:JSON.stringify({first_name:$('#first').value,last_name:$('#last').value,gender:$('#gender').value,birth_date:$('#birth').value,death_date:$('#death').value,birth_place:$('#place').value,notes:$('#notes').value,photo_url:$('#photo').value,anchor_person_id:anchor,relation_type:rt,parent_direction:rt==='parent'?$('#parentDirection').value:'parent_to_child'})});toast('Anggota berhasil ditambahkan.');openTree(S.tree.id,false)}catch(x){toast(x.message)}}
async function editPerson(id){let p=S.persons.find(x=>x.id===id);if(!p)return;$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Edit Anggota</h2><button class="ghost" type="button" onclick="closeModal()">Tutup</button></div><form class="form" onsubmit="savePerson(event,${id})"><label class="small muted">Nama depan</label><input id="efirst" placeholder="Nama depan" value="${esc(p.first_name)}" required><label class="small muted">Nama belakang</label><input id="elast" placeholder="Nama belakang" value="${esc(p.last_name||'')}"><label class="small muted">Jenis kelamin</label><select id="egender"><option value="male" ${p.gender==='male'?'selected':''}>Laki-laki</option><option value="female" ${p.gender==='female'?'selected':''}>Perempuan</option><option value="other" ${p.gender==='other'?'selected':''}>Lainnya</option></select><label class="small muted">Tanggal lahir (opsional)</label><input id="ebirth" type="date" value="${esc(p.birth_date||'')}"><label class="small muted">Tanggal meninggal (opsional — bukan wajib)</label><input id="edeath" type="date" value="${esc(p.death_date||'')}"><input id="eplace" placeholder="Tempat lahir" value="${esc(p.birth_place||'')}"><textarea id="enotes" placeholder="Catatan">${esc(p.notes||'')}</textarea><input id="ephoto" placeholder="URL foto (opsional)" value="${esc(p.photo_url||'')}"><div class="notice small">Tanggal meninggal boleh dikosongkan dan tidak wajib diisi.</div><div class="actions"><button>Simpan perubahan</button><button class="ghost" type="button" onclick="closeModal()">Batal</button></div></form></div></div>`}
async function savePerson(e,id){e.preventDefault();try{await api('/persons/'+id,{method:'PATCH',body:JSON.stringify({first_name:$('#efirst').value,last_name:$('#elast').value,gender:$('#egender').value,birth_date:$('#ebirth').value,death_date:$('#edeath').value,birth_place:$('#eplace').value,notes:$('#enotes').value,photo_url:$('#ephoto').value})});closeModal();openTree(S.tree.id,false)}catch(x){toast(x.message)}}async function delPerson(id){if(!confirm('Hapus anggota dan relasinya?'))return;try{await api('/persons/'+id,{method:'DELETE'});openTree(S.tree.id,false)}catch(e){toast(e.message)}}
async function shareToggle(current){if(current){const ok=await askConfirm('Nonaktifkan publik?','Silsilah akan menjadi privat. Link publik tidak lagi dapat dibuka oleh umum.');if(!ok)return}try{let d=await api('/trees/'+S.tree.id+'/share',{method:'POST',body:JSON.stringify({is_public:!current})});toast(d.public?'Silsilah sekarang publik.':'Silsilah sekarang privat.');openTree(S.tree.id,false)}catch(e){toast(e.message)}}async function showChildOrder(){const parents=S.persons.filter(p=>p.can_edit!==false&&S.rels.some(r=>r.type==='parent'&&r.from_person_id===p.id));if(!parents.length){toast('Belum ada hubungan orang tua → anak.');return}const opts=parents.map(p=>`<option value="${p.id}">${esc(full(p))}</option>`).join('');$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Atur Urutan Anak</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="hint">Pilih orang tua lalu gunakan tombol ↑/↓ untuk menentukan anak pertama hingga terakhir.</p><select id="orderParent" onchange="renderChildOrder()">${opts}</select><div id="orderList" class="order-list" style="margin-top:12px"></div></div></div>`;renderChildOrder()}function renderChildOrder(){const pid=Number($('#orderParent')?.value);if(!pid)return;const ids=S.rels.filter(r=>r.type==='parent'&&r.from_person_id===pid).map(r=>r.to_person_id);ids.sort((a,b)=>(Number(S.persons.find(p=>p.id===a)?.sibling_order||0)-Number(S.persons.find(p=>p.id===b)?.sibling_order||0))||String(full(S.persons.find(p=>p.id===a)||'')).localeCompare(String(full(S.persons.find(p=>p.id===b)||''))));$('#orderList').innerHTML=ids.map((id,i)=>{const p=S.persons.find(x=>x.id===id);return `<div class="order-row"><span><b>${i+1}.</b> ${esc(full(p))}</span><span class="actions"><button class="ghost" onclick="moveChild(${pid},${id},-1)" ${i===0?'disabled':''}>↑</button><button class="ghost" onclick="moveChild(${pid},${id},1)" ${i===ids.length-1?'disabled':''}>↓</button></span></div>`}).join('')}async function moveChild(parentId,childId,delta){let ids=S.rels.filter(r=>r.type==='parent'&&r.from_person_id===parentId).map(r=>r.to_person_id);ids.sort((a,b)=>(Number(S.persons.find(p=>p.id===a)?.sibling_order||0)-Number(S.persons.find(p=>p.id===b)?.sibling_order||0))||String(full(S.persons.find(p=>p.id===a)||'')).localeCompare(String(full(S.persons.find(p=>p.id===b)||''))));const i=ids.indexOf(childId),j=i+delta;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];try{await api('/trees/'+S.tree.id+'/children-order',{method:'PATCH',body:JSON.stringify({parentId,childIds:ids})});S.persons.forEach(p=>{const k=ids.indexOf(p.id);if(k>=0)p.sibling_order=k+1});renderChildOrder();toast('Urutan anak disimpan.')}catch(e){toast(e.message)}}
async function showClaims(){let r=await api('/trees/'+S.tree.id+'/claims');$('#app').insertAdjacentHTML('afterbegin',`<div class="card" id="claimPanel"><div class="row"><h3>Permintaan Klaim</h3><button class="ghost" onclick="$('#claimPanel').remove()">Tutup</button></div>${r.claims.map(c=>`<div class="item row"><span>${esc(c.requester_name)} ingin mengklaim <b>${esc(c.first_name+' '+c.last_name)}</b></span><span><button onclick="claimAction(${c.id},'approve')">Terima</button><button class="danger" onclick="claimAction(${c.id},'reject')">Tolak</button></span></div>`).join('')||'<p class="muted">Tidak ada permintaan.</p>'}</div>`)}async function claimAction(id,a){try{await api('/trees/'+S.tree.id+'/claims',{method:'POST',body:JSON.stringify({claimId:id,action:a})});showClaims()}catch(e){toast(e.message)}}async function showInvites(){let r=await api('/trees/'+S.tree.id+'/invites');let opts=S.persons.filter(p=>p.can_edit!==false).map(p=>`<option value="${p.id}">${esc(full(p))}</option>`).join('');$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Undang Family Member</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="muted">Pilih anggota yang sudah dibuat. Calon Family Member mendaftar sendiri, lalu Owner Akun menerima atau menolak permintaan.</p><form class="form" onsubmit="createInvite(event)"><label class="small muted">Anggota yang akan diwakili</label><select id="invitePerson" required><option value="">Pilih anggota...</option>${opts}</select><label class="small muted">Email (opsional jika WhatsApp)</label><input id="inviteEmail" type="email" placeholder="email@example.com"><label class="small muted">Nomor WhatsApp (opsional jika email)</label><input id="invitePhone" inputmode="tel" placeholder="62812xxxx"><div class="actions"><button>Buat Undangan</button><button class="ghost" type="button" onclick="closeModal()">Batal</button></div></form><div class="notice"><b>Undangan & permintaan</b>${r.invites.map(i=>`<div class="item"><div class="row"><div><b>${esc(i.first_name+' '+i.last_name)}</b><div class="small muted">${esc(i.requester_name||i.invited_email||i.invited_phone||'-')} · ${i.requested_at?'Menunggu persetujuan Owner Akun':'Menunggu calon mendaftar'}</div></div><button class="danger" onclick="deleteInvite(${i.id})">Hapus</button></div>${i.requested_at?`<div class="actions" style="margin-top:8px"><button onclick="inviteDecision(${i.id},'approve')">Terima</button><button class="danger" onclick="inviteDecision(${i.id},'reject')">Tolak</button></div>`:''}</div>`).join('')||'<div class="muted" style="margin-top:8px">Belum ada.</div>'}</div></div></div>`}function closeModal(){$('#modal').innerHTML=''}
async function sendInviteWhatsApp(phone,msg){const p=String(phone||'').replace(/[^0-9]/g,'');const u=p?`https://wa.me/${p}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;location.href=u}
async function sendInviteEmail(email,msg){const subject='Undangan Family Member JejakNasab';location.href=`mailto:${encodeURIComponent(String(email||''))}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}`}
async function createInvite(e){e.preventDefault();try{let d=await api('/trees/'+S.tree.id+'/invites',{method:'POST',body:JSON.stringify({personId:Number($('#invitePerson').value),email:$('#inviteEmail').value,phone:$('#invitePhone').value})});let msg=`Undangan JejakNasab untuk ${d.personName}. Daftar Family Member melalui link ini: ${d.inviteUrl}`;$('#modal').innerHTML=`<div class="modal"><div class="card"><h2>Undangan dibuat</h2><p class="muted">${esc(msg)}</p><div class="actions">${(()=>{const w=d.phone?`https://wa.me/${String(d.phone).replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;return `<a class="link-button" href="${w}" target="_blank" rel="noopener">Kirim WhatsApp</a>`})()}${d.email?`<a class="ghost link-button" href="mailto:${encodeURIComponent(d.email)}?subject=${encodeURIComponent('Undangan Family Member JejakNasab')}&body=${encodeURIComponent(msg)}">Kirim Email</a>`:''}<button class="ghost" onclick="copyInviteText(${JSON.stringify(msg)})">Salin</button></div><button class="ghost" style="margin-top:10px" onclick="showInvites()">Selesai</button></div></div>`}catch(x){toast(x.message)}}

async function deleteInvite(id){const ok=await askConfirm('Hapus undangan?','Undangan ini akan dihapus dari daftar dan link undangan tidak dapat digunakan lagi.');if(!ok)return;try{await api('/trees/'+S.tree.id+'/invites/'+id,{method:'DELETE'});toast('Undangan dihapus.');showInvites()}catch(e){toast(e.message)}}
async function inviteDecision(id,action){try{await api('/trees/'+S.tree.id+'/invites/'+id,{method:'POST',body:JSON.stringify({action})});toast(action==='approve'?'Family Member diterima':'Permintaan ditolak');showInvites()}catch(e){toast(e.message)}}
function privacySortedPersons(){const g=graphRows(S.persons,S.rels),out=[],seen=new Set();const visit=id=>{if(seen.has(id))return;const p=g.byId.get(id);if(!p)return;seen.add(id);out.push(p);for(const sid of g.spouses.get(id)||[])if(!seen.has(sid)){const sp=g.byId.get(sid);if(sp){seen.add(sid);out.push(sp)}}for(const cid of g.children.get(id)||[])visit(cid)};g.roots.forEach(r=>visit(r.id));S.persons.filter(p=>!seen.has(p.id)).sort((a,b)=>String(full(a)).localeCompare(String(full(b)))).forEach(p=>visit(p.id));return out}
function privacyChecks(prefix,v){return `<div class="check-grid"><label><input id="${prefix}_name" type="checkbox" ${v.show_name?'checked':''}> Nama</label><label><input id="${prefix}_age" type="checkbox" ${v.show_age?'checked':''}> Usia</label><label><input id="${prefix}_birth" type="checkbox" ${v.show_birth_date?'checked':''}> Tanggal lahir</label><label><input id="${prefix}_place" type="checkbox" ${v.show_birth_place?'checked':''}> Tempat lahir</label><label><input id="${prefix}_photo" type="checkbox" ${v.show_photo?'checked':''}> Foto</label><label><input id="${prefix}_notes" type="checkbox" ${v.show_notes?'checked':''}> Catatan</label></div>`}
function showPublicSettings(){const persons=privacySortedPersons();const rows=persons.map((p,i)=>`<div class="item row"><div><b>${i+1}. ${esc(full(p))}</b><div class="small muted">Nama & usia default · detail lainnya dapat diatur</div></div><button onclick="privacyPerson(${p.id})">Atur</button></div>`).join('');$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Pengaturan Info Publik</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><p class="hint">Default aman: ☑ Nama · ☑ Usia · ☐ Tanggal lahir · ☐ Tempat lahir · ☐ Foto · ☐ Catatan. Hanya Owner Akun yang dapat mengubahnya.</p><div class="bulk-box"><b>Terapkan pengaturan ke semua anggota</b><span class="small muted">Atur satu kali, lalu gunakan untuk seluruh anggota.</span><button style="margin-top:10px" onclick="showBulkPrivacy()">Atur Semua Anggota</button></div>${rows||'<p class="muted">Belum ada anggota.</p>'}</div></div>`}
async function showBulkPrivacy(){let r=await api('/trees/'+S.tree.id+'/privacy');let v=r.privacy||{show_name:1,show_age:1,show_birth_date:0,show_birth_place:0,show_photo:0,show_notes:0};$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Info Publik Semua Anggota</h2><button class="ghost" onclick="showPublicSettings()">Kembali</button></div><p class="hint">Pengaturan ini diterapkan ke semua anggota. Default aman tetap Nama + Usia.</p>${privacyChecks('bulk',v)}<div class="actions" style="margin-top:14px"><button onclick="saveBulkPrivacy()">Terapkan ke Semua</button><button class="ghost" onclick="showPublicSettings()">Batal</button></div></div></div>`}
async function saveBulkPrivacy(){try{await api('/trees/'+S.tree.id+'/privacy',{method:'PATCH',body:JSON.stringify({show_name:$('#bulk_name').checked,show_age:$('#bulk_age').checked,show_birth_date:$('#bulk_birth').checked,show_birth_place:$('#bulk_place').checked,show_photo:$('#bulk_photo').checked,show_notes:$('#bulk_notes').checked})});toast('Pengaturan info publik semua anggota disimpan.');showPublicSettings()}catch(e){toast(e.message)}}
async function privacyPerson(id){let p=S.persons.find(x=>x.id===id);if(!p)return;let r=await api('/persons/'+id+'/privacy');let v=r.privacy||{};$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>Info Publik: ${esc(full(p))}</h2><button class="ghost" onclick="showPublicSettings()">Kembali</button></div><p class="muted">Pilih informasi yang boleh terlihat setelah pengunjung mengetuk nama anggota. Tampilan pohon tetap ringkas: nama + usia.</p>${privacyChecks('pr',v)}<button style="margin-top:14px" onclick="savePrivacy(${id})">Simpan pengaturan</button></div></div>`}
async function savePrivacy(id){try{await api('/persons/'+id+'/privacy',{method:'PATCH',body:JSON.stringify({show_name:$('#pr_name').checked,show_age:$('#pr_age').checked,show_birth_date:$('#pr_birth').checked,show_birth_place:$('#pr_place').checked,show_photo:$('#pr_photo').checked,show_notes:$('#pr_notes').checked})});closeModal();toast('Pengaturan info publik disimpan')}catch(e){toast(e.message)}}
async function invitePage(tok){S.inviteToken=tok;$('#navActions').innerHTML='';try{let d=await api('/invite/'+encodeURIComponent(tok));$('#app').innerHTML=`<div class="card setup-card"><div class="setup-kicker">UNDANGAN FAMILY MEMBER</div><h1>Gabung ke Silsilah</h1><p class="setup-note">Anda diundang untuk mewakili anggota <b>${esc(d.personName)}</b> pada silsilah <b>${esc(d.treeName)}</b>.</p><div class="notice">Anda tetap harus mendaftar sebagai Family Member. Setelah akun aktif dan Anda mengajukan bergabung, Owner Akun akan menerima atau menolak permintaan.</div><div class="actions"><button onclick="showRegister(${JSON.stringify(tok)})">Daftar Family Member</button><button class="ghost" onclick="showLogin()">Saya sudah punya akun</button></div></div>`}catch(e){$('#app').innerHTML=`<div class="card"><h2>Undangan tidak tersedia</h2><p class="muted">${esc(e.message)}</p></div>`}}
async function publicTree(tok){$('#navActions').innerHTML='';try{let d=await api('/public/trees/'+encodeURIComponent(tok)+'?v='+Date.now());S.publicPersons=new Map(d.persons.map(p=>[p.id,p]));$('#app').innerHTML=`<div class="public-card"><div class="public-head"><div class="eyebrow">SILSILAH KELUARGA</div><h2 style="margin:8px 0 22px;font-size:clamp(32px,7vw,52px)">${esc(d.tree.name)}</h2><p class="muted">${esc(d.tree.description||'')}</p></div><div class="tree-toolbar"><button class="ghost tree-zoom" onclick="publicZoom(-0.1)">−</button><button class="ghost tree-zoom" onclick="publicZoom(0.1)">+</button><button class="ghost" onclick="publicZoomReset()">Reset</button></div><div class="tree-viewport no-border-tree" id="publicViewport"><div class="public-stage" id="publicStage"><div class="no-border-tree">${buildPublic(d.persons,d.relationships)}</div></div></div><div class="notice">Profil publik mengikuti pengaturan privasi Owner. Ketuk nama anggota untuk melihat informasi yang diizinkan.</div></div>`;window.publicScale=1;publicZoomReset()}catch(e){$('#app').innerHTML=`<div class="card"><h2>Silsilah tidak tersedia</h2><p>${esc(e.message)}</p></div>`}}function treeZoom(delta){window.treeScale=Math.max(.5,Math.min(2,Number(window.treeScale||1)+delta));const s=$('#treeStage');if(s){s.style.transform=`scale(${window.treeScale})`;s.style.transformOrigin='top left'}}function treeZoomReset(){window.treeScale=1;const s=$('#treeStage');if(s){s.style.transform='scale(1)';s.style.transformOrigin='top left'}}function publicZoom(delta){window.publicScale=Math.max(.5,Math.min(2,Number(window.publicScale||1)+delta));const s=$('#publicStage');if(s){s.style.transform=`scale(${window.publicScale})`;s.style.width='max-content';s.style.height='auto';s.style.transformOrigin='top left'}}function publicZoomReset(){window.publicScale=1;const s=$('#publicStage');if(s){s.style.transform='scale(1)';s.style.width='max-content';s.style.height='auto';s.style.transformOrigin='top left'}}
function publicPersonInfo(id){let p=S.publicPersons?.get(id);if(!p)return;$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="row"><h2>${esc(p.name)}</h2><button class="ghost" onclick="closeModal()">Tutup</button></div><div class="public-info">${p.photo_url?`<img class="photo" src="${esc(p.photo_url)}" alt="">`:''}${p.age!=null?`<div><b>Usia:</b> ${p.age} tahun${p.isDeceased?' (wafat)':''}${p.death_date?` · tahun wafat ${esc(String(p.death_date).slice(0,4))}`:''}</div>`:''}${p.birth_date?`<div><b>Tanggal lahir:</b> ${esc(p.birth_date)}</div>`:''}${p.death_date?`<div><b>Tanggal meninggal:</b> ${esc(p.death_date)}</div>`:''}${p.birth_place?`<div><b>Tempat lahir:</b> ${esc(p.birth_place)}</div>`:''}${p.notes?`<div><b>Catatan:</b><div style="white-space:pre-wrap;margin-top:5px">${esc(p.notes)}</div></div>`:''}</div></div></div>`}
async function copyText(x){const text=String(x??'');if(!text)return false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch{}const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';ta.style.left='0';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();return ok}
async function copyWithFallback(text,targetId,label='Teks'){const value=String(text??'');if(await copyText(value)){toast('✓ '+label+' berhasil disalin.');return true}const el=targetId?$('#'+targetId):null;if(el){el.removeAttribute('readonly');el.focus();el.select();el.setSelectionRange(0,el.value.length);el.classList.add('copy-target');setTimeout(()=>el.setAttribute('readonly',''),1000)}toast('Browser memblokir salin otomatis. Teks sudah dipilih — tekan lama lalu pilih “Salin”.');return false}
async function copyPublicLink(x){if(!x)return toast('Link publik belum tersedia.');return copyWithFallback(x,'publicLinkInput','Link publik')}
function openPublicLink(x){if(!x)return toast('Link publik belum tersedia.');window.location.assign(x)}
async function copyInviteText(text){return copyWithFallback(text,null,'Undangan')}

function buildPublic(ps,rs){return buildTreePublic(ps,rs)}function buildTreePublic(ps,rs){const g=graphRows(ps,rs),used=new Set();function family(id){if(used.has(id))return '';const p=g.byId.get(id);if(!p)return '';used.add(id);let partner=(g.spouses.get(id)||[]).map(x=>g.byId.get(x)).find(x=>x&&!used.has(x.id));if(partner)used.add(partner.id);const people=[p,partner].filter(Boolean),childIds=[];for(const x of people)for(const cid of g.children.get(x.id)||[])if(!used.has(cid))childIds.push(cid);const unique=[...new Set(childIds)];return `<div class="tree-family"><div class="tree-couple">${people.map(x=>`<div class="node-wrap">${publicNode(x)}</div>`).join('')}</div>${unique.length?`<div class="family-children">${unique.map(cid=>family(cid)).join('')}</div>`:''}</div>`}let html=g.roots.map(r=>family(r.id)).join('');const extra=ps.filter(p=>!used.has(p.id));if(extra.length)html+=`<div class="notice"><b>Anggota lain</b><div class="tree-level">${extra.map(publicNode).join('')}</div></div>`;return html||'<p class="muted">Belum ada jalur keluarga untuk ditampilkan.</p>'}function publicNode(p){const deathYear=p.death_date?String(p.death_date).slice(0,4):'';return `<div class="node public-person public-node" onclick="publicPersonInfo(${p.id})"><b>${esc(p.name)}</b>${p.age!=null?`<span>${p.isDeceased?`Wafat · ${p.age} tahun${deathYear?' · '+deathYear:''}`:`${p.age} tahun`}</span>`:''}</div>`}
boot();
</script></body></html>
